<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>비밀번호 찾기</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: rgba(20, 20, 20, 0.8); /* 배경을 투명하게 설정 */
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
</style>
<script>
const pwSearchCheck = async() => {

	if(email.value == "") { alert("이메일을 입력하세요."); email.focus();  return false; }
	if(username.value == '') { alert("이름을 입력하세요."); username.focus(); return false; }

	let formData = new FormData(pwSearchForm);
	
	await fetch("/member/searchPassword", {			
		method: 'POST',
		body: formData			
		
	}).then((response)=> response.json())
	  .then((data) => {
		  if(data.status == 'good'){				
			let result = "<br><br><h1>임시패스워드 : " + data.password + "</h1>";					
			TemporalPassword.innerHTML = result;
		  } else if(data.status == 'EMAIL_NOT_FOUND'){
			  alert("해당 이메일을 가진 사용자가 없습니다.");
		  }	else if(data.status == 'USERNAME_NOT_FOUND'){
			  alert("사용자 이름이 잘못 되었습니다.");
		  }
	}).catch((error)=> {			
		console.log((error)=> console.log("error = " + error))
	});
}

const press = () => {
	if(event.keyCode == 13){ pwSearchCheck(); }
}
</script>

</head>
<body>
	<div class="main">
		<div class="ModifyForm">
			<form name="pwSearchForm" class="pwSearchForm" id="pwSearchForm" method="post">
        		<h1>비밀번호 찾기</h1>
        		   	<div class="pwSearchFormDivision">
         				<input type="text" name="email" id="email" class="input_field" placeholder="이메일을 입력하세요."><br><br>
         				<input type="text" id="username" name="username" class="input_field" onkeydown="press(this.form)" placeholder="이름을 입력하세요."><br><br>
         				<input type="button" id="btn_pwSearch" class="btn_write" value="인증 요청" onclick="pwSearchCheck()"> <br><br>
          			<input type="button" class="btn_cancel" value="홈으로" onclick="javascript:location.href='/'">
        			</div> 
        	</form>
        	<div class="TemporalPassword" id="TemporalPassword"></div>
		</div>
	</div>

</body>

</html>
