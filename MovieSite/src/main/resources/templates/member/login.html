<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인</title>
<style>
	body {
		font-family: Arial, sans-serif;
	    background-color: rgba(20, 20, 20, 0.8); /* 배경을 투명하게 설정 */
	    color: white;
	    display: flex;
	    justify-content: center;
	    height: 100vh;
	    margin: 0;
	}

	.main {
	    text-align: center;
	}
	.WriteForm {
	    background-color: rgba(34, 34, 34, 0.9); /* 투명한 배경색 */
	    padding: 4px 70px;
	    border-radius: 5px;
	    border: 2px solid transparent; /* 테두리를 투명하게 설정 */
	    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
	    margin: 0 auto; /* 중앙 정렬 */
		text-align: center;
	}
	
	.input_field {
	    width: 100%;
		box-sizing: border-box;
	    padding: 24px 16px ;
	    margin-bottom: 15px;
	    border: 1px solid white;
	    border-radius: 3px;
	    background-color: #333;
	    color: white;
		
	}

	.input_field:focus {
	    border: 1px solid #e50914; /* 포커스 시 강조 색상 */
	}

	.btn_login {
	    width: 100%;
	    padding: 10px;
	    background-color: #4dbf00 ; /* 로그인 버튼 색상 */
	    border: none;
	    border-radius: 3px;
	    color: white;
	    font-size: 16px;
	    cursor: pointer;
		box-sizing: border-box;
	}

	.btn_login:hover {
	    background-color: #f40612; /* 버튼 호버 시 색상 */
	}

	.bottomText {
	    margin-top: 10px;
	    color: white;
		font-size: 25px;
	}
	
	.bottomText1 {
		margin-top: 10px;
		color: white;
		font-size: 18px;
	}
	
	h1 {
		font-size: 50px;
		color: white;
		margin-bottom: 20px;
	}
	
	a {
		color: white;
	}

	.input_field::placeholder {
	    font-size: 16px; /* 글씨 크기 조정 */
	    color: #bbb; /* 색상 조정 (진하게 하려면 어두운 색으로) */
	    font-weight: normal; /* 글씨를 진하게 설정 */
	}
	
	.btn_login {
	    width: 100%;
	    padding: 15px 0;
	    margin-bottom: 10px;
	    border-radius: 5px;
	    border: none;
	    font-size: 16px;
	    cursor: pointer;
	}
	
	.oauth-buttons {
	    display: flex;
	    flex-direction: column;
	}

	.oauth-btn {
	    width: 100%;
	    padding: 15px 0;
	    margin-bottom: 10px;
	    border-radius: 5px;
	    border: none;
	    font-size: 16px;
	    cursor: pointer;
	}

	.kakao {
	    background-color: #FEE500; /* 카카오 노란색 */
	    color: #3C1E1E; /* 카카오 텍스트 색상 */
	}

	.naver {
	    background-color: #03C75A; /* 네이버 초록색 */
	    color: white; /* 네이버 텍스트 색상 */
	}

	.facebook {
	    background-color: #1877F2; /* 페이스북 파란색 */
	    color: white; /* 페이스북 텍스트 색상 */
	}

	.apple {
	    background-color: black; /* 애플 검정색 */
	    color: white; /* 애플 텍스트 색상 */
	}




</style>

<script defer>
window.onload = async () => {
		
	//쿠키 가져 오기 
	const getCookie = (name) => {
			
		const cookies = document.cookie.split(`; `).map((el)=>el.split('='));
		let getItem = []; 
			
		for(let i=0; i<cookies.length;i++){
			if(cookies[i][0] === name){
				getItem.push(cookies[i][1]);
				break;
			}
		} 
		if(getItem.length > 0) {
			return decodeURIComponent(getItem[0]);
		}
	};
		
	const session_email = '[[${session.email}]]';
	if(getCookie('remember-me') !== '' && session_email !== '')
		document.location.href='/board/list?page=1';
		
	let email = getCookie('email');
	let password = getCookie('password');
				
	//email 쿠키가 존재하면...
	if(email !== undefined){
		document.querySelector('#rememberEmail').checked = true;
		document.querySelector('#email').value = email;
	}else {
		document.querySelector('#rememberEmail').checked = false;
	}
		
	//패스워드 쿠키가 존재하면...
	if(password !== undefined){
		document.querySelector('#rememberPassword').checked = true;
		//Base64로 인코딩 된 password를 디코딩
		const decrypt = CryptoJS.enc.Base64.parse(password);
		const hashData = decrypt.toString(CryptoJS.enc.Utf8);
		password = hashData;
			
		document.querySelector('#password').value = password;
	}else {
		document.querySelector('#rememberPassword').checked = false;
	}
		
};

//Spring Security가 진행하는 로그인
//로그아웃 페이지로 이동
const login = () => {
	document.location.href="/board/list";
	//document.loginForm.action = '/member/login';
};

//스프링 시큐리티에 의한 로그인 처리 전에 서버로 email,password를 보내서 인증 처리를 해야 함 
const loginCheck = async () => {
	const email = document.querySelector('#email');
	const password = document.querySelector('#password');
	const msg = document.querySelector('#msg');
			
	if(email.value === ''){
		alert("이메일을 입력하세요");
		email.focus();
		return false;
	}

	if(password.value === ''){
		alert("비밀번호를 입력하세요");
		password.focus();
		return false;
	}
	
	let formData = new FormData();
	formData.append("email", email.value);
	formData.append("password", password.value);
	
	await fetch('/member/loginCheck', {
		method: 'POST',	
		body:formData
	}).then((response)=> response.json())
      .then((data) => {
		  if(data.message === 'good'){
			  cookieManage(email.value,password.value);
			  login();		  
		  } else if(data.message == 'ID_NOT_FOUND') {
			  msg.innerHTML = '존재하지 않는 아이디입니다.';
		  } else if(data.message == 'PASSWORD_NOT_FOUND'){
			  msg.innerHTML = '잘못된 비밀번호입니다.';
		  }	else {
			  alert("시스템 장애로 로그인이 실패했습니다.");
		  }	  
	}).catch((error) => {
		console.log("error = " + error);
	});
	
};

//이메일 체크 관리
const checkRememberEmail = () => {
	if(document.querySelector('#rememberEmail').checked)
		document.querySelector('#rememberMe').checked = false;
};

//패스워드 체크 관리
const checkRememberPassword = () => {
	if(document.querySelector('#rememberPassword').checked)
		document.querySelector('#rememberMe').checked = false;
};

//자동 로그인 체크 관리
const checkRememberMe = () => {
	if(document.querySelector('#rememberMe').checked){
		document.querySelector('#rememberEmail').checked = false;
		document.querySelector('#rememberPassword').checked = false;
	}
};

//쿠키 관리
const cookieManage = (email,password) => {
	
	const rememberEmail = document.querySelector('#rememberEmail');
	const rememberPassword = document.querySelector('#rememberPassword');
	
	//email가 체크되었을 경우
	if(rememberEmail.checked) {
		document.cookie = 'email=' + email + '; path=/; expires=Tue, 31, Dec 2024 23:59:59 GMT';
	}else {
		document.cookie = 'email=' + email + '; path=/; max-age=0';
	}
	
	//password가 체크되었을 경우
	if(rememberPassword.checked) {
		//Base64(양방향 복호화 알고리즘)로 패스워드 인코딩
		const key = CryptoJS.enc.Utf8.parse(password);
		const base64 = CryptoJS.enc.Base64.stringify(key);
		password = base64;
		document.cookie = 'password=' + password + '; path=/; expires=Tue, 31, Dec 2024 23:59:59 GMT';
	}else {
		document.cookie = 'password=' + password + '; path=/; max-age=0';
	}		
};

const press = (event) => {
	if(event.keyCode === 'Enter') loginCheck();
};	

</script>
</head>

<body>
<div class="main" align="center">
	<div class="WriteForm">
		<h1>로그인</h1><br><br>
	<form name="loginForm" id="loginForm" method="POST">
		<input type="text" name="email" id="email" class="input_field" placeholder="이메일을 입력하세요." 
				onfocus="this.placeholder='';" onblur="if(this.value === '') this.placeholder='이메일을 입력하세요.';"><br><br>
		<input type="password" name="password" id="password" class="input_field" onkeydown="press()"
			placeholder="비밀번호 8자 이상 입력하세요." onfocus="this.placeholder='';" onblur="if(this.value === '') this.placeholder='비밀번호를 입력하세요.';">
		<p id="msg" style="color:red; text-align:center"></p>
		<br>
		<input type="checkbox" id="rememberEmail" onclick="checkRememberEmail()">이메일 기억
		<input type="checkbox" id="rememberPassword" onclick="checkRememberPassword()">비밀번호 기억
		<input type="checkbox" id="rememberMe" class="remember" name="remember-me" onclick="checkRememberMe()">자동 로그인
		<br><br>
		<input type="button" id="btn_login"	class="btn_login" value="로그인" onclick="loginCheck()"><br><br><br><br>
	
		<div class="oauth-buttons">
		               <button class="oauth-btn kakao">카카오로 시작하기</button>
		               <button class="oauth-btn naver">네이버로 시작하기</button>
		               <button class="oauth-btn facebook">페이스북으로 시작하기</button>
		               <button class="oauth-btn apple">Apple로 시작하기</button>
		           </div>

		
	<div class="bottomText"><a href="/member/signup">회원가입<br><br></div>
		<div class="bottomText1">
		[<a href="/member/searchEmail" onmouseover="this.style.textDecoration='underline';"
					onmouseout="this.style.textDecoration='none';">이메일</a> | 
		 <a href="/member/searchPassword" onmouseover="this.style.textDecoration='underline';"
					onmouseout="this.style.textDecoration='none';">비밀번호</a> 찾기] <br><br>
		</div>
	</form>
	</div>
</div>
</body>
</html>
