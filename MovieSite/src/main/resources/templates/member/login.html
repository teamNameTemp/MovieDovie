<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인</title>
<style>
	body {
		font-family: Arial, sans-serif;
	    background-color: rgba(20, 20, 20, 0.8); /* 배경을 투명하게 설정 */
	    color: white;
	    display: flex;
	    justify-content: center;
	    height: 100vh;
	    margin: 0;
	}

	.main {
	    text-align: center;
	}
	.WriteForm {
	    background-color: rgba(34, 34, 34, 0.9); /* 투명한 배경색 */
	    padding: 4px 70px;
	    border-radius: 5px;
	    border: 2px solid transparent; /* 테두리를 투명하게 설정 */
	    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
	    margin: 0 auto; /* 중앙 정렬 */
		text-align: center;
	}
	
	.input_field {
	    width: 100%;
		box-sizing: border-box;
	    padding: 24px 16px ;
	    margin-bottom: 15px;
	    border: 1px solid white;
	    border-radius: 3px;
	    background-color: #333;
	    color: white;
		
	}

	.input_field:focus {
	    border: 1px solid #e50914; /* 포커스 시 강조 색상 */
	}

	.btn_login {
	    width: 100%;
	    padding: 10px;
	    background-color: #4dbf00 ; /* 로그인 버튼 색상 */
	    border: none;
	    border-radius: 3px;
	    color: white;
	    font-size: 16px;
	    cursor: pointer;
		box-sizing: border-box;
	}

	.btn_login:hover {
	    background-color: #f40612; /* 버튼 호버 시 색상 */
	}

	.bottomText {
	    margin-top: 10px;
	    color: white;
		font-size: 25px;
	}
	
	.bottomText1 {
		margin-top: 10px;
		color: white;
		font-size: 18px;
	}
	
	h1 {
		font-size: 50px;
		color: white;
		margin-bottom: 20px;
	}
	
	a {
		color: white;
	}

	.input_field::placeholder {
	    font-size: 16px; /* 글씨 크기 조정 */
	    color: #bbb; /* 색상 조정 (진하게 하려면 어두운 색으로) */
	    font-weight: normal; /* 글씨를 진하게 설정 */
	}
	
	.btn_login {
	    width: 100%;
	    padding: 15px 0;
	    margin-bottom: 10px;
	    border-radius: 5px;
	    border: none;
	    font-size: 16px;
	    cursor: pointer;
	}
	
	.oauth-buttons {
	    display: flex;
	    flex-direction: column;
	}

	.oauth-btn {
	    width: 100%;
	    padding: 15px 0;
	    margin-bottom: 10px;
	    border-radius: 5px;
	    border: none;
	    font-size: 16px;
	    cursor: pointer;
	}

	.kakao {
	    background-color: #FEE500; /* 카카오 노란색 */
	    color: #3C1E1E; /* 카카오 텍스트 색상 */
	}

	.naver {
	    background-color: #03C75A; /* 네이버 초록색 */
	    color: white; /* 네이버 텍스트 색상 */
	}

	.facebook {
	    background-color: #1877F2; /* 페이스북 파란색 */
	    color: white; /* 페이스북 텍스트 색상 */
	}

	.apple {
	    background-color: black; /* 애플 검정색 */
	    color: white; /* 애플 텍스트 색상 */
	}




</style>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
<script defer>
window.onload = async () => {
    const getCookie = (name) => {
        const cookies = document.cookie.split(`; `).map((el) => el.split('='));
        let getItem = [];
        
        for (let i = 0; i < cookies.length; i++) {
            if (cookies[i][0] === name) {
                getItem.push(cookies[i][1]);
                break;
            }
        }
        if (getItem.length > 0) {
            return decodeURIComponent(getItem[0]);
        }
    };

    const session_email = '[[${session.email}]]';
    if (getCookie('remember-me') === 'true' && session_email !== '') {
        document.location.href = '/board/selectGenre'; // 로그인 유지 상태 시 자동으로 /board/selectGenre로 이동
    }

    let email = getCookie('email');
    let password = getCookie('password');

    if (email !== undefined) {
        document.querySelector('#rememberEmail').checked = true;
        document.querySelector('#email').value = email;
    } else {
        document.querySelector('#rememberEmail').checked = false;
    }

    if (password !== undefined) {
        document.querySelector('#rememberPassword').checked = true;
        const decrypt = CryptoJS.enc.Base64.parse(password);
        const hashData = decrypt.toString(CryptoJS.enc.Utf8);
        password = hashData;
        document.querySelector('#password').value = password;
    } else {
        document.querySelector('#rememberPassword').checked = false;
    }
};

// 로그인 시 페이지 이동 함수
const login = () => {
    document.location.href = "/board/selectGenre"; // 로그인 성공 시 이동할 페이지 설정
};

// 로그인 체크 함수
const loginCheck = async () => {
    const email = document.querySelector('#email');
    const password = document.querySelector('#password');
    const msg = document.querySelector('#msg');

    if (email.value === '') {
        alert("이메일을 입력하세요");
        email.focus();
        return false;
    }

    if (password.value === '') {
        alert("비밀번호를 입력하세요");
        password.focus();
        return false;
    }

    let formData = new FormData();
    formData.append("email", email.value);
    formData.append("password", password.value);

    await fetch('/member/loginCheck', {
        method: 'POST',
        body: formData
    }).then((response) => response.json())
    .then((data) => {
        if (data.message === 'good') {
            if (document.querySelector('#rememberMe').checked) {
                cookieManage(email.value, password.value);
            }
            login(); // 로그인 성공 시 login 함수 호출
        } else if (data.message === 'EMAIL_NOT_FOUND') {
            msg.innerHTML = '존재하지 않는 이메일입니다.';
        } else if (data.message === 'PASSWORD_NOT_FOUND') {
            msg.innerHTML = '잘못된 비밀번호입니다.';
        } else {
            alert("시스템 장애로 로그인이 실패했습니다.");
        }
    }).catch((error) => {
        console.log("error = " + error);
    });
};

// Enter 키로 로그인 시도 함수 수정
const press = (event) => {
    if (event.key === "Enter") {
        event.preventDefault(); // 기본 폼 제출 방지
        loginCheck(); // Enter 키를 누르면 loginCheck 함수 호출
    }
};

document.addEventListener("DOMContentLoaded", () => {
    // 이메일과 비밀번호 입력 필드에 Enter 키 이벤트 추가
    document.querySelector('#email').addEventListener("keydown", press);
    document.querySelector('#password').addEventListener("keydown", press);
});

// 자동 로그인, 이메일 기억 설정, 비밀번호 저장 등의 기능은 기존대로 유지
</script>

</head>

<body>
<div class="main" align="center">
    <div class="WriteForm">
        <h1>로그인</h1><br><br>
    <form name="loginForm" id="loginForm" method="POST" onsubmit="event.preventDefault(); loginCheck();">
        <input type="text" class="input_field" id="email" name="email" placeholder="이메일을 입력하세요">
        <input type="password" class="input_field" id="password" name="password" placeholder="비밀번호를 입력하세요" onkeydown="press(event)">
        <p id="msg" style="color:red; text-align:center"></p>
        <br>
        <input type="checkbox" id="rememberEmail" onclick="checkRememberEmail()">이메일 기억
        <input type="checkbox" id="rememberPassword" onclick="checkRememberPassword()">비밀번호 기억
        <input type="checkbox" id="rememberMe" class="remember" name="remember-me" onclick="checkRememberMe()">자동 로그인
        <br><br>
        <input type="button" id="btn_login" class="btn_login" value="로그인" onclick="loginCheck()"><br><br><br><br>
    
        <div class="oauth-buttons">
            <button class="oauth-btn kakao" onclick="redirectToUrl(event, '/oauth2/authorization/kakao')">카카오로 시작하기</button>
            <button class="oauth-btn naver" onclick="redirectToUrl(event, '/oauth2/authorization/naver')">네이버로 시작하기</button>
            <button class="oauth-btn facebook" onclick="redirectToUrl(event, '/oauth2/authorization/facebook')">페이스북으로 시작하기</button>
            <button class="oauth-btn apple" onclick="redirectToUrl(event, '/oauth2/authorization/google')">Apple로 시작하기</button>

            <script>
                function redirectToUrl(event, url) {
                    event.preventDefault(); // 기본 동작 방지
                    console.log("Redirecting to:", url);
                    window.location.href = url;
                }
            </script>

        </div>

        
    <div class="bottomText"><a href="/member/signup">회원가입<br><br></div>
        <div class="bottomText1">
        [<a href="/member/searchEmail" onmouseover="this.style.textDecoration='underline';"
                    onmouseout="this.style.textDecoration='none';">이메일</a> | 
         <a href="/member/searchPassword" onmouseover="this.style.textDecoration='underline';"
                    onmouseout="this.style.textDecoration='none';">비밀번호</a> 찾기] <br><br>
        </div>
    </form>
    </div>
</div>
</body>

</html>
