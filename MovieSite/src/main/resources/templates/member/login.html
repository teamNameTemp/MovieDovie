<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인</title>
<style>
	body {
		font-family: Arial, sans-serif;
	    background-color: rgba(20, 20, 20, 0.8); /* 배경을 투명하게 설정 */
	    color: white;
	    display: flex;
	    justify-content: center;
	    height: 100vh;
	    margin: 0;
	}

	.main {
	    text-align: center;
	}
	.WriteForm {
	    background-color: rgba(34, 34, 34, 0.9); /* 투명한 배경색 */
	    padding: 4px 70px;
	    border-radius: 5px;
	    border: 2px solid transparent; /* 테두리를 투명하게 설정 */
	    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
	    margin: 0 auto; /* 중앙 정렬 */
		text-align: center;
	}
	
	.input_field {
	    width: 100%;
		box-sizing: border-box;
	    padding: 24px 16px ;
	    margin-bottom: 15px;
	    border: 1px solid white;
	    border-radius: 3px;
	    background-color: #333;
	    color: white;
		
	}

	.input_field:focus {
	    border: 1px solid #e50914; /* 포커스 시 강조 색상 */
	}

	.btn_login {
	    width: 100%;
	    padding: 10px;
	    background-color: #4dbf00 ; /* 로그인 버튼 색상 */
	    border: none;
	    border-radius: 3px;
	    color: white;
	    font-size: 16px;
	    cursor: pointer;
		box-sizing: border-box;
	}

	.btn_login:hover {
	    background-color: #f40612; /* 버튼 호버 시 색상 */
	}

	.bottomText {
	    margin-top: 10px;
	    color: white;
		font-size: 25px;
	}
	
	.bottomText1 {
		margin-top: 10px;
		color: white;
		font-size: 18px;
	}
	
	h1 {
		font-size: 50px;
		color: white;
		margin-bottom: 20px;
	}
	
	a {
		color: white;
	}

	.input_field::placeholder {
	    font-size: 16px; /* 글씨 크기 조정 */
	    color: #bbb; /* 색상 조정 (진하게 하려면 어두운 색으로) */
	    font-weight: normal; /* 글씨를 진하게 설정 */
	}
	
	.btn_login {
	    width: 100%;
	    padding: 15px 0;
	    margin-bottom: 10px;
	    border-radius: 5px;
	    border: none;
	    font-size: 16px;
	    cursor: pointer;
	}
	
	.oauth-buttons {
	    display: flex;
	    flex-direction: column;
	}

	.oauth-btn {
	    width: 100%;
	    padding: 15px 0;
	    margin-bottom: 10px;
	    border-radius: 5px;
	    border: none;
	    font-size: 16px;
	    cursor: pointer;
	}

	.kakao {
	    background-color: #FEE500; /* 카카오 노란색 */
	    color: #3C1E1E; /* 카카오 텍스트 색상 */
	}

	.naver {
	    background-color: #03C75A; /* 네이버 초록색 */
	    color: white; /* 네이버 텍스트 색상 */
	}

	.facebook {
	    background-color: #1877F2; /* 페이스북 파란색 */
	    color: white; /* 페이스북 텍스트 색상 */
	}

	.apple {
	    background-color: black; /* 애플 검정색 */
	    color: white; /* 애플 텍스트 색상 */
	}




</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.2/rollups/aes.js"></script>
<script>
window.onload = async () => {
    // 쿠키에서 값을 가져오는 함수
    const getCookie = (name) => {
        const cookies = document.cookie.split('; ').map(cookie => cookie.split('='));
        for (let i = 0; i < cookies.length; i++) {
            if (cookies[i][0] === name) {
                return decodeURIComponent(cookies[i][1]);
            }
        }
        return null; // 쿠키가 없다면 null 반환
    };
	
	const session_email = '[[${session.email}]]';
	if(getCookie('remember-me') !== '' && session_email !== '')
		document.location.href='/board/selectGenre';

    // 이메일 쿠키가 존재하면 이메일 입력란에 자동 입력
    const email = getCookie('email');
    const password = getCookie('password');

    if (email !== null) {
        document.querySelector('#rememberEmail').checked = true;
        document.querySelector('#email').value = email;
    } else {
        document.querySelector('#rememberEmail').checked = false;
    }

    // 비밀번호가 쿠키에 존재하면 자동 입력
    if (password !== null) {
        document.querySelector('#rememberPassword').checked = true;
        const decryptedPassword = CryptoJS.enc.Base64.parse(password).toString(CryptoJS.enc.Utf8);
        document.querySelector('#password').value = decryptedPassword;
    } else {
        document.querySelector('#rememberPassword').checked = false;
    }
};

// 로그인 처리 함수
const loginCheck = async () => {
    const email = document.querySelector('#email');
    const password = document.querySelector('#password');
    const msg = document.querySelector('#msg'); // 메시지 출력 요소

    // 이메일, 비밀번호 입력 확인
    if (email.value === '') {
        alert("이메일을 입력하세요");
        email.focus();
        return false;
    }

    if (password.value === '') {
        alert("비밀번호를 입력하세요");
        password.focus();
        return false;
    }

    let formData = new FormData();
    formData.append("email", email.value);
    formData.append("password", password.value);

    await fetch('/member/loginCheck', {
        method: "POST",
        body: formData
    }).then((response) => response.json())
        .then((data) => {
            msg.innerHTML = ''; // 기존 메시지 초기화
            msg.style.color = 'red'; // 오류 메시지의 색상 설정
            
            if (data.message === 'good') {
                cookieManage(email.value, password.value);
                document.loginForm.submit();
            } else if (data.message === 'EMAIL_NOT_FOUND') {
                msg.innerHTML = '존재하지 않는 이메일입니다.';
            } else if (data.message === 'PASSWORD_NOT_FOUND') {
                msg.innerHTML = '잘못된 비밀번호입니다.';
            } 
        }).catch((error) => {
            console.log("error = " + error);
            msg.innerHTML = '로그인 처리 중 오류가 발생했습니다.';
        });
};

// 로그인 쿠키 관리
const cookieManage = (email, password) => {
    // 이메일, 비밀번호 기억 체크박스 상태에 따라 쿠키 저장
    if (document.querySelector('#rememberEmail').checked) {
        document.cookie = `email=${encodeURIComponent(email)}; path=/; expires=Tue, 31 Dec 2024 23:59:59 GMT`;
    } else {
        document.cookie = 'email=; path=/; max-age=0'; // 이메일 쿠키 삭제
    }

    if (document.querySelector('#rememberPassword').checked) {
        const encryptedPassword = CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(password));
        document.cookie = `password=${encryptedPassword}; path=/; expires=Tue, 31 Dec 2024 23:59:59 GMT`;
    } else {
        document.cookie = 'password=; path=/; max-age=0'; // 비밀번호 쿠키 삭제
    }

    // 자동 로그인 체크박스가 선택되었을 때만 저장
    if (document.querySelector('#rememberMe').checked) {
        document.cookie = 'remember-me=true; path=/; expires=Tue, 31 Dec 2024 23:59:59 GMT';
    } else {
        document.cookie = 'remember-me=; path=/; max-age=0'; // 자동 로그인 쿠키 삭제
    }
};

// 이메일 체크박스 상태 관리
const checkRememberEmail = () => {
    if (document.querySelector('#rememberEmail').checked)
        document.querySelector('#rememberMe').checked = false;
};

// 비밀번호 체크박스 상태 관리
const checkRememberPassword = () => {
    if (document.querySelector('#rememberPassword').checked)
        document.querySelector('#rememberMe').checked = false;
};

// 자동 로그인 체크박스 상태 관리
const checkRememberMe = () => {
    if (document.querySelector('#rememberMe').checked) {
        document.querySelector('#rememberEmail').checked = false;
        document.querySelector('#rememberPassword').checked = false;
    }
};

const press = (event) => {
    if (event.keyCode == 13) {
        event.preventDefault();
        loginCheck();
    }
};

const redirectToUrl = (event, url) => {
    event.preventDefault();
    window.location.href = url;
};
</script>

<body>
<div class="main" align="center">
    <div class="WriteForm">
        <h1>로그인</h1><br><br>
    <form name="loginForm" id="loginForm" method="POST" onsubmit="event.preventDefault(); loginCheck();">
        <input type="text" class="input_field" id="email" name="email" placeholder="이메일을 입력하세요">
        <input type="password" class="input_field" id="password" name="password" placeholder="비밀번호를 입력하세요" onkeydown="press(event)">
        <p id="msg" style="color:red; text-align:center"></p>
        <br>
        <input type="checkbox" id="rememberEmail" onclick="checkRememberEmail()">이메일 기억
        <input type="checkbox" id="rememberPassword" onclick="checkRememberPassword()">비밀번호 기억
        <input type="checkbox" id="rememberMe" class="remember" name="remember-me" onclick="checkRememberMe()">자동 로그인
        <br><br>
        <input type="button" id="btn_login" class="btn_login" value="로그인" onclick="loginCheck()"><br><br><br><br>
    
        <div class="oauth-buttons">
            <button class="oauth-btn kakao" onclick="redirectToUrl(event, '/oauth2/authorization/kakao')">카카오로 시작하기</button>
            <button class="oauth-btn naver" onclick="redirectToUrl(event, '/oauth2/authorization/naver')">네이버로 시작하기</button>
            <button class="oauth-btn google" onclick="redirectToUrl(event, '/oauth2/authorization/google')">Google로 시작하기</button>
        </div>

        <div class="bottomText"><a href="/member/signup">회원가입<br><br></div>
        <div class="bottomText1">
        [<a href="/member/searchEmail" onmouseover="this.style.textDecoration='underline';"
                    onmouseout="this.style.textDecoration='none';">이메일</a> | 
         <a href="/member/searchPassword" onmouseover="this.style.textDecoration='underline';"
                    onmouseout="this.style.textDecoration='none';">비밀번호</a> 찾기] <br><br>
        </div>
    </form>
    </div>
</div>
</body>
</html>
