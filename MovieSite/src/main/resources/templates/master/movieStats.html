<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>영화 통계</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
<style>
 #wrap {width: 1200px; height: 600px; font-size: 15px; text-align: center; margin: 0 auto;}

        .content1, .content2, .content3 {
		    display: flex;
		    justify-content: center; /* 수평 중앙 정렬 */
		    align-items: center; /* 수직 중앙 정렬 */
		    width: 400px;
		    height: 600px; /* 고정 높이 유지 */
		    text-align: center;
		    text-align: center;
		    float: left;
		}
		.content {
            width: 90%; /* 부모 너비에 맞춤 */
            height: 90%; /*부모 너비에 맞춤*/
            text-align: center;
            background-color: white;
            padding: 1%; /* 패딩 10% */
            border: 2px solid lightgray;
            box-sizing: border-box; /* 패딩 포함한 크기 계산 */
        }

</style>


</head>
<body class="p-3 m-0 border-0 bd-example m-0 border-0">

<div th:replace = "/fragments/nav/sidebar::sidebar"></div>
 <div class="navbar">
     <div class="navbar-container">

             <h1 class="logo">Admin Page</h1>

         <div class="menu-container">
             <ul class="menu-list">
                 <li class="menu-list-item">
                 	<a href="/master/memberStats">회원 활동 통계</a>
                 </li>
                 <li class="menu-list-item">
                 	<a href="/master/memberRequest">회원 요청사항 관리</a>
                 </li>
                 <li class="menu-list-item active">
                 	<a href="/master/movieStats">영화 통계</a>
                 </li>
                 <li class="menu-list-item">
                 	<a href="/master/movieUpload">영화 업로드</a>
                 </li>
			</ul>
		</div>
		<div class="profile-container">
             <img class="profile-picture" src="/img/masterprofile.png" alt="">
             <div class="profile-text-container">
                 <span class="profile-text">관리자</span>
                 <i class="fas fa-caret-down"></i>
             </div>
             <div class="toggle">
                 <i class="fas fa-moon toggle-icon"></i> 
                 <i class="fas fa-sun toggle-icon"></i> 
                 <div class="toggle-ball"></div>
             </div>
         </div>
     </div>
 </div>

<div id="wrap">
	<div class="content1">
		<div class="content">

			<br><b>장르별 인기순 (회원들 좋아하는 장르 순)</b><br><br>
			<p>1위 : SF</p>
			<p>2위 : 판타지</p>
			<p>3위 : 다큐멘터리</p>
		</div>
	
	</div>
	
	<div class="content2">
		<div class="content">

			<br><b>좋아요 % 높은거 10개로 자르기.</b><br><br>
			<p>1위 : 엠마 왓슨</p>
			<p>2위 : 마고 로비</p>
			<p>3위 : 제니퍼 로렌스</p>
			
			<br><b>싫어요 % 높은거 10개로 자르기.</b><br><br>
			<p>1위 : 엠마 왓슨</p>
			<p>2위 : 마고 로비</p>
			<p>3위 : 제니퍼 로렌스</p>
		</div>
	
	
	</div>
	<div class="content3">
		<div class="content">

			<br><b>호불호 갈리는 영화 (50:50)</b><br><br>
			<p>1위 : 해리포터</p>
			<p>2위 : 아이언맨</p>
			<p>3위 : 스파이더맨</p>
		</div>
	
	</div>
</div>

</body>
</html>
