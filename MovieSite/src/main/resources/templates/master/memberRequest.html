<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>회원 요청사항 관리</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
	<style>
		.main {
		  text-align: center;
		}
		
		table {
		  border-collapse: collapse;
		  width: 1000px;
		  margin: 1rem auto;
		  background-color: white;
		}
		
		/* 테이블 행 */
		th, td {
		  padding: 3px;
		  text-align: center;
		  border-bottom: 1px solid #ddd;
		  text-align: center;
		}
		
		th {
		  background-color: #1b1b1b;
		  color: #ddd;
		}
		
		/* 테이블 올렸을 때 */
		tbody tr:hover {
		  background-color: #d3d3d3;
		  opacity: 0.9;
		  cursor: pointer;
		}
		
		/* 테이블 비율 */
		th:nth-child(1),
		td:nth-child(1) {
		  width: 5%;
		}
		
		th:nth-child(2),
		td:nth-child(2) {
		  width: 50%;
		}
		
		th:nth-child(3),
		td:nth-child(3) {
		  width: 12%;
		}
		
		th:nth-child(4),
		td:nth-child(4) {
		  width: 23%;
		}
		
		th:nth-child(5),
		td:nth-child(5) {
		  width: 10%;
		}
		
		tr:nth-child(even) {
		  background-color: #4dbf0010;
		}
		
	</style>
	<script>
		const search = () => {
			const keyword = document.querySelector('#keyword');
			document.location.href='/memberRequest/list?page=1&keyword=' + keyword.value;
		}
	
		const press = () => {
			if(event.keyCode == 13) search();
		}
	</script>
</head>
<body class="p-3 m-0 border-0 bd-example m-0 border-0">

<div th:replace = "/fragments/nav::sidebar"></div>
 <div class="navbar">
     <div class="navbar-container">

             <h1 class="logo">Admin Page</h1>

         <div class="menu-container">
             <ul class="menu-list">
                 <li class="menu-list-item">
                 	<a href="/master/memberStats">회원 활동 통계</a>
                 </li>
                 <li class="menu-list-item active">
                 	<a href="/master/memberRequest">회원 요청사항 관리</a>
                 </li>
                 <li class="menu-list-item">
                 	<a href="/master/movieStats">영화 통계</a>
                 </li>
                 <li class="menu-list-item">
                 	<a href="/master/movieUpload">영화 업로드</a>
                 </li>
			</ul>
		</div>
		<div class="profile-container">
             <img class="profile-picture" src="/img/masterprofile.png" alt="">
             <div class="profile-text-container">
                 <span class="profile-text">관리자</span>
                 <i class="fas fa-caret-down"></i>
             </div>
             <div class="toggle">
                 <i class="fas fa-moon toggle-icon"></i> 
                 <i class="fas fa-sun toggle-icon"></i> 
                 <div class="toggle-ball"></div>
             </div>
         </div>
     </div>
 </div>

<br><br><br>
<div class = "main">
	<h3>회원 요청 사항</h3>
	
	<br>
	<input type="text" name="keyword" id="keyword" 
         		style="width:35%;height:28px;border:2px solid #4dbf00;font-size: 15px;border-radius:10px"
         		placeholder=" 검색할 제목, 작성자이름 및 내용을 입력하세요." onkeydown="press()"> &nbsp;
    <input type="button" value="검색" 
             style="width:5%;height:33px;background:#4dbf00;color:white; border-radius:10px;border:none;font-weight:bold;cursor:pointer;"
             	onclick="search()">		
	<br><br>
		 
	<table class="table table-sm">
	  <thead class="table-light">
	    <tr>
	      <th scope="col">번호</th>
	      <th scope="col">제목</th>
	      <th scope="col">작성자</th>
	      <th scope="col">작성일</th>
	      <th scope="col">처리 상태</th>
	    </tr>
	  </thead>
	  <tbody>
	    <tr>
	      <th scope="row">1</th>
	      <td><a href="/master/memberRequestView">어벤져스 올려주세요..</a></td>
	      <td>지호</td>
	      <td>2023-10-08</td>
	      <td>처리 중</td>
	    </tr>
	    <tr>
	      <th scope="row">2</th>
	      <td>영화 더 많이</td>
	      <td>지후</td>
	      <td>2023-12-25</td>
	      <td>처리 중</td>
	    </tr>
	    <tr>
	      <th scope="row">3</th>
	      <td>왜 이건 없어요?</td>
	      <td>지현</td>
	      <td>2024-01-25</td>
	      <td>처리 중</td>
	    </tr>
	  </tbody>
	</table>
	
	
</div>


</body>
</html>
