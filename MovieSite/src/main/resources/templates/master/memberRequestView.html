<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>회원 요청 사항 보기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
<style>
.main {
	text-align: center;
}

.field {
  width: 90%;
  height:25px;
  outline:none;
  color: #636e72;
  font-size:16px;
  background: none;
  border-bottom: 2px solid #adadad;
  margin: 30px;
  padding: 10px 10px;
}

.content {
  width: 90%;
  height: 350px;
  overflow: auto;
  margin: 22px;
  padding: 10px;
  box-sizing: border-box;
  border: solid #adadad;
  text-align: left;
  font-size: 16px;
  resize: both;
}

.boardView {
  width:60%;
  height:auto;
  margin:auto;
  text-align: left;
  padding: 20px, 20px;
  background-color:#FFFFFF;
  border:4px solid gray;
  border-radius: 20px;
}
	
</style>
</head>
<body>
<div th:replace = "/fragments/nav::sidebar"></div>
 <div class="navbar">
     <div class="navbar-container">
         <div class="logo-container">
             <h1 class="logo">Admin Page</h1>
         </div>
         <div class="menu-container">
             <ul class="menu-list">
                 <li class="menu-list-item">
                 	<a href="/master/memberStats">회원 활동 통계</a>
                 </li>
                 <li class="menu-list-item active">
                 	<a href="/master/memberRequest">회원 요청사항 관리</a>
                 </li>
                 <li class="menu-list-item">
                 	<a href="/master/movieStats">영화 통계</a>
                 </li>
                 <li class="menu-list-item">
                 	<a href="/master/movieUpload">영화 업로드</a>
                 </li>
			</ul>
		</div>
		<div class="profile-container">
             <img class="profile-picture" src="/img/masterprofile.png" alt="">
             <div class="profile-text-container">
                 <span class="profile-text">관리자</span>
                 <i class="fas fa-caret-down"></i>
             </div>
             <div class="toggle">
                 <i class="fas fa-moon toggle-icon"></i> 
                 <i class="fas fa-sun toggle-icon"></i> 
                 <div class="toggle-ball"></div>
             </div>
         </div>
     </div>
 </div>
<div class="main">
        
        <h1 style="text-align: center;">게시물 내용 보기</h1>
        <br>

        <div class="boardView">
            <div class="field">글쓴이 : </div>
            <div class="field">제목 : </div>
            <div class="field">날짜 : </div>
            <div class="content"></div>
			
			<br>
      
        </div>
		 <br>
        <div class="bottom_menu">
      		<a class="preseqno" href="#">이전 ▼</a>&nbsp;&nbsp;
      		<a class="requestlist" href="/master/memberRequest">목록가기</a>&nbsp;&nbsp;
      		<a class="afterseqno" href="#">다음 ▲</a>
      		<input type="button" id="preseqno" name="preseqno" value="다음 ▲">
        </div>
        <br>
		 <div class="replyDiv" style="width:60%;height:300px;margin:auto;text-align:left;">
			<p id="replyNotice">댓글을 작성해 주세요.</p>
			<form id="replyForm" name="replyForm" method="POST">
				작성자 : <input type="text" id="replywriter" name="replywriter" value="${session.username}" readonly><br>
				<textarea id="replycontent" name="replycontent" cols="80" rows="5" maxlength="150" placeholder="글자수:150자 이내">댓글 작성 부분!</textarea><br>
				<input type="hidden" id="seqno" name="seqno" value="${view.seqno}">
				<input type="hidden" id="userid" name="userid" value="${session.userid}">
			</form>
			<input type="button" id="btn_reply" value="댓글등록" onclick="replyRegister()">
			<input type="button" id="btn_cancel" value="취소" onclick="replyCancel()">
			<hr>
			<div id="replyList" style="width:100%; height:600px; overflow:auto;"></div>		
		</div> 
      <br><br>        
    </div>

</body>
</html>
