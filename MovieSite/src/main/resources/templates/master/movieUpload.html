<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>영화 업로드</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
<style>

.boardView {
  width:60%;
  height:auto;
  margin:auto;
  text-align: left;
  padding: 20px, 20px;
  background-color:#FFFFFF;
  border:4px solid gray;
  border-radius: 20px;
}

.main {
  text-align: center;
}

.input_field {
  width: 90%;
  border:none;
  border-bottom: 2px solid #adadad;
  margin: 10px;
  padding: 10px;
  outline:none;
  color: #636e72;
  font-size:16px;
  height:25px;
  background: none;
}

.btn_write  {
  position:relative;
  left:20%;
  transform: translateX(-50%);
  margin-top: 20px;
  margin-bottom: 10px;
  width:40%;
  height:40px;
  background: red;
  background-position: left;
  background-size: 200%;
  color:white;
  font-weight: bold;
  border:none;
  cursor:pointer;
  transition: 0.4s;
  display:inline;
}

</style>

</head>

<body class="p-3 m-0 border-0 bd-example m-0 border-0">
<div th:replace = "/fragments/nav::sidebar"></div>
 <div class="navbar">
     <div class="navbar-container">
         <div class="logo-container">
             <h1 class="logo">Admin Page</h1>
         </div>
         <div class="menu-container">
             <ul class="menu-list">
                 <li class="menu-list-item">
                 	<a href="/master/memberStats">회원 활동 통계</a>
                 </li>
                 <li class="menu-list-item">
                 	<a href="/master/memberRequest">회원 요청사항 관리</a>
                 </li>
                 <li class="menu-list-item">
                 	<a href="/master/movieStats">영화 통계</a>
                 </li>
                 <li class="menu-list-item active">
                 	<a href="/master/movieUpload">영화 업로드</a>
                 </li>
			</ul>
		</div>
		<div class="profile-container">
             <img class="profile-picture" src="/img/masterprofile.png" alt="">
             <div class="profile-text-container">
                 <span class="profile-text">관리자</span>
                 <i class="fas fa-caret-down"></i>
             </div>
             <div class="toggle">
                 <i class="fas fa-moon toggle-icon"></i> 
                 <i class="fas fa-sun toggle-icon"></i> 
                 <div class="toggle-ball"></div>
             </div>
         </div>
     </div>
 </div>
<br><br><br>
<div class="main">

	<h5 style="text-align: center;">영화 대량 파일 업로드 시 <a class="massUpload" href="#">여기</a>를 클릭하세요</h5>
	<br><br><br>
	<h1 style="text-align: center;">영화 개별 업로드</h1>
	<!-- 여기서 개별로 업로드한 영화 파일들은 tbl_movieUploadedByMaster 테이블에 업로드 예정. -->
	
     <br>
     <div class="boardView">
    	<br>
        <input type="text" class="input_field" id="movieCd" name="movieCd" placeholder="영화 코드">
        <input type="text" class="input_field" id="movieNm" name="movieNm" placeholder="영화 제목(한글)">
		<input type="text" class="input_field" id="movieNmEn" name="movieNmEn" placeholder="영화 제목(영어)">
		<input type="text" class="input_field" id="prodtYear" name="prodtYear" placeholder="제작 연도">
		<input type="text" class="input_field" id="nationAlt" name="nationAlt" placeholder="제작 국가">
		<input type="text" class="input_field" id="typeNm" name="typeNm" placeholder="유형">
		<input type="text" class="input_field" id="genreid" name="genreid" placeholder="장르">
		<input type="text" class="input_field" id="prodtStatNm" name="prodtStatNm" placeholder="제작 상태">
		<input type="text" class="input_field" id="directors" name="directors" placeholder="감독">
		<input type="text" class="input_field" id="companyNm" name="companyNm" placeholder="제작사">
		<br>
   		<input type="button" id="btnRegister" class="btn_write" value="업로드하기">	
   		
     </div>
     
</div>

</body>
</html>
