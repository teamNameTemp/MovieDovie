<style>

.input_field {
  width: 90%;

  border-bottom: 2px solid #adadad;
  margin: 12px;
  padding: 10px;
  outline:none;
  color: #636e72;
  font-size:15px;
  height:25px;

.imageZone {
	border: 2px solid #92AAB0;
	width: 60%;
	height: auto;
	color: #92AAB0;
	text-align: center;
	vertical-align: middle;
	margin: auto;
	padding: 10px 10px;
	font-size: 150%;
}

.input_content{
  width: 90%;
  height: 200px;
  margin: 15px;
  padding: 15px;
  box-sizing: border-box;
  border: 2px solid #adadad;
  font-size: 15px;
  resize: both;
}

.btn_write  {
  position:relative;
  left:20%;
  transform: translateX(-50%);
  margin-top: 20px;
  margin-bottom: 10px;
  width:40%;
  height:40px;
  background: #4dbf00;
  background-position: center;
  background-size: 150%;
  color:white;
  font-weight: bold;
  border:none;
  cursor:pointer;
  transition: 0.4s;
  display:inline;
}

.btn_write > a:hover, .btn_write > a:active {
	background-color: #1E90FF;
	text-decoration: none;
}

</style>

<script>
window.onload = () => {
	
	var imgCheck = "N";
	var imgZone = document.querySelector('#imageZone');
	var fileEvent = document.querySelectcor('#imageFile');
	
	//imageZone 영역 클릭 시 파일이벤트 작동.
	imgZone.addEventListener('click', (e) => {
		fileEvent.click(e);
	})
	
	fileEvent.addEventListener('change', (e) => {
		const files = e.target.files;
		showImage(files);
	})
	
	const showImage = (files) => {
		imgZone.innerHTML = '';
		const imgFile = files[0];
		
		if(imgFile.type.indexOf("image")<0){
			alert("이미지 파일만 업로드하세요");
			return false;
		}
		
		const reader = new FileReader(); //new 연산자를 통해서 FileReader 객체를 reader가 참조(상속)
		reader.onload = function(event) { //reader.readAsDataURL(imgFile)로 이미지를 읽고 나서 해야 할 일
			imgZone.innerHTML = "<img src=" + event.target.result + " id='uploadImg' style='width:350px;height:auto'>";
		};
		
		reader.readAsDataURL(imgFile); //실제로 이미지 파일을 읽는 부분
		imgCheck = "Y";	
	}
	
	
	btnRegister.addEventListener('click',async ()=> {
		
		//유효성 검사
		if(imgCheck == 'N') {
			alert("영화 포스터 이미지를 등록하세요");
			return false;
		}		
		if(movieCd.value == '') {
			alert("영화 코드를 입력하세요.");
			movieCd.focus();
			return false;
		}
		if(movieNm.value == '') {
			alert("영화제목(국문)을 입력하세요.");
			movieNm.focus();
			return false;
		}
		if(movieEn.value == '') {
			alert("영화제목(영문)을 입력하세요.");
			movieEn.focus();
			return false;
		}
		if(nation.value == '') {
			alert("제작 국가를 입력하세요.");
			nation.focus();
			return false;
		}
		if(company.value == '') {
			alert("제작사를 입력하세요.");
			company.focus();
			return false;
		}
		if(actor.value == '') {
			alert("배우를 입력하세요.");
			actor.focus();
			return false;
		}
		
		const genre = document.querySelectorAll('input[name=genre]:checked');
		if(genre.length == 0) { alert('장르를 선택하세요.'); return false; }
		
		const formData = new FormData(UploadForm);
		
		await fetch('/master/movieUpload', {
			method: 'POST',
			body: formData	
		}).then((response)=> response.json())
		  .then((data)=> {
			  if(data.message === 'good'){
				  alert("영화 등록이 완료되었습니다.");
				  document.location.href='/master/memberRequest?page=1';
			  } else {
				  alert('서버 장애로 영화 업로드에 실패했습니다.');
			  }
		  }).catch((error) => {
			  console.log("error=" + error);
		  });	  
		});
}
