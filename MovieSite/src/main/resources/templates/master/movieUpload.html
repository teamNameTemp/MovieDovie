<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>영화 업로드</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
<style>

.boardView {
  width:70%;
  height:auto;
  margin:auto;
  text-align: left;
  padding: 60px;
  background-color:#FFFFFF;
  border:3px solid gray;
  border-radius: 4px;
}

.main {
  text-align: center;
}

.form-group {
  display: flex;
  align-items: center;
  margin: 12px 0;
}

.form-group label {
  width: 20%;  /* 라벨의 너비 설정 */
  font-size: 15px;
  margin-right: 1px;  /* 라벨과 input 필드 사이의 간격 */
  text-align: left;  /* 라벨 텍스트 우측 정렬 */
}

.input_field {
  width: 78%;
  border:none;
  border-bottom: 2px solid #adadad;
  margin: 14px 0;
  padding: 9px;
  outline:none;
  color: #636e72;
  font-size:15px;
  height:25px;
  background: none;
  box-sizing: border-box;
}

.imageZone {
	border: 2px solid #92AAB0;
	width: 60%;
	height: auto;
	color: #92AAB0;
	text-align: center;
	vertical-align: middle;
	margin: auto;
	padding: 10px 10px;
	font-size: 150%;
}

.input_content{
  width: 85%;
  height: 200px;
  margin: 15px;
  padding: 15px;
  box-sizing: border-box;
  border: 2px solid #adadad;
  font-size: 15px;
  resize: both;
}

.btn_write  {
  position:relative;
  left:50%;
  transform: translateX(-50%);
  margin-top: 20px;
  margin-bottom: 10px;
  width:40%;
  height:40px;
  background: #4dbf00;
  background-position: center;
  background-size: 150%;
  color:white;
  font-weight: bold;
  border:none;
  cursor:pointer;
  transition: 0.4s;
  display:inline;
}

.btn_write > a:hover, .btn_write > a:active {
	background-color: #F08080;
	text-decoration: none;
}

.genres-box {
  width : 75%;
  border: 2px solid #adadad;  /* 박스 테두리 색상 */
  padding: 15px;  /* 박스 내부 여백 */
  margin: 10px 0;  /* 박스 위아래 여백 */
  border-radius: 5px;  /* 박스 모서리 둥글게 */
  background-color: #f9f9f9;  /* 박스 배경 색상 */
}

.genres-box label {
  margin-right: 15px;  /* 각 체크박스 간격 */
}

.genres-box input[type="checkbox"] {
  margin-right: 5px;  /* 체크박스와 텍스트 간격 */
}

.genres-box .row {
  display: flex;
  flex-wrap: wrap;  /* 여러 줄로 나누기 */
}

.genres-box .row label {
  width: 20%;  /* 한 줄에 두 개씩 표시 */
  margin-bottom: 10px;  /* 항목 간 간격 */
  box-sizing: border-box;  /* padding, margin이 포함되게 */
}

</style>

<script>
window.onload = () => {
	
	var imgCheck = "N";
	var imgZone = document.querySelector('#imageZone');
	var fileEvent = document.querySelector('#imageFile');
	var btnRegister = document.querySelector('#btnRegister');
	
	//imageZone 영역 클릭 시 파일이벤트 작동.
	imgZone.addEventListener('click', (e) => {
		fileEvent.click(e);
	})
	
	fileEvent.addEventListener('change', (e) => {
		const files = e.target.files; //선택한 파일 정보가 e.target.files(배열)에 저장
		showImage(files);
	})
	
	const showImage = (files) => {
		
		imgZone.innerHTML = '';
		const imgFile = files[0];
		
		if(imgFile.type.indexOf("image") < 0){
			alert("이미지 파일만 업로드하세요");
			return false;
		}
		
		const reader = new FileReader(); //new 연산자를 통해서 FileReader 객체를 reader가 참조(상속)
		reader.onload = function(event) { //reader.readAsDataURL(imgFile)로 이미지를 읽고 나서 해야 할 일
			imgZone.innerHTML = "<img src=" + event.target.result + " id='uploadImg' style='width:350px;height:auto'>";
		};
		
		reader.readAsDataURL(imgFile); //실제로 이미지 파일을 읽는 부분
		imgCheck = "Y";	
	};
	
	
	btnRegister.addEventListener('click', async ()=> {
		
		//유효성 검사
		if(imgCheck == 'N') {alert("영화 포스터 이미지를 등록하세요"); return false;}	
		if(movieNm.value == '') {alert("영화제목(국문)을 입력하세요."); movieNm.focus(); return false;}
		if(showtime.value == '') {alert("상영 시간을 입력하세요."); showtime.focus(); return false;}
		if(nations.value == '') {alert("제작 국가를 입력하세요."); nations.focus(); return false;}
		if(companys.value == '') {alert("제작사를 입력하세요."); companys.focus(); return false;}
		if(actors.value == '') {alert("배우를 입력하세요."); actors.focus(); return false;}
		if(overview.value == '') {alert("줄거리를 입력하세요."); overview.focus(); return false;}
		if(directors.value == '') {alert("감독을 입력하세요."); directors.focus(); return false;}
		
		const genres = document.querySelectorAll('input[name=genres]:checked'); //유사 배열
		const watchGradeNm = document.querySelector('select[name=watchGradeNm] option:checked');
		if(genres.length == 0) { alert('장르를 선택하세요.'); return false; }
		if(watchGradeNm.value == '00') { alert('관람등급을 선택하세요.'); return false; }
		
		const formData = new FormData(UploadForm);
		
		await fetch('/master/movieUpload', {
			method: 'POST',
			body: formData	
		}).then((response)=> response.json())
		  .then((data)=> {
			  if(data.message === 'good'){
				  alert("영화 등록이 완료되었습니다.");
				  document.location.href='/master/memberRequest?page=1';
			  } else {
				  alert('서버 장애로 영화 업로드에 실패했습니다.');
			  }
		  }).catch((error) => {
			  console.log("error=" + error);
		  });	  
		});
}

		  if (data == 0){

			  movieCheckNotice.innerHTML = "이미 등록되어 있는 영화입니다.";
			  movieNm.focus();
		  }
	  });
}
*/

</script>

</head>

<div th:replace = "/fragments/nav/sidebar::sidebar"></div>
 <div class="navbar">
     <div class="navbar-container">

             <h1 class="logo">Admin Page</h1>

         <div class="menu-container">
             <ul class="menu-list">
                 <li class="menu-list-item">
                 	<a href="/master/memberStats">회원 활동 통계</a>
                 </li>
                 <li class="menu-list-item">
                 	<a href="/master/memberRequest">회원 요청사항 관리</a>
                 </li>
                 <li class="menu-list-item">

                 </li>
                 <li class="menu-list-item active">
                 	<a href="/master/movieUpload">영화 업로드</a>

		</div>

             <img class="profile-picture" src="/img/masterprofile.png" alt="">
             <div class="profile-text-container">
                 <span class="profile-text">관리자</span>

             </div>
             <div class="toggle">

 </div>
<br><br><br>
<div class="main">

	<h1 style="text-align: center;">영화 개별 업로드</h1>
	
     <br>
     <div class="boardView">
    	<br>
    	<form id="UploadForm" name="UploadForm" method="POST" enctype="multipart/form-data">
	        
	        <input type="file" name="fileUpload" id="imageFile" style="display:none"/>
	        <div class="imageZone" id="imageZone"><br>영화포스터 업로드<br><br></div><br><br>

			<!-- 영화 제목 (한글) -->
	        <div class="form-group">
	            <label for="movieNm">영화 제목(한글):</label>
	            <input type="text" class="input_field" id="movieNm" name="movieNm" placeholder="영화 제목(한글)" onchange="movieCheck()">
	            <span id="movieCheckNotice"></span>
	        </div>
	        
	        <!-- 영화 제목 (영어) -->
	        <div class="form-group">
	            <label for="movieNmEn">영화 제목(영어):</label>
	            <input type="text" class="input_field" id="movieNmEn" name="movieNmEn" placeholder="영화 제목(영어)">
	        </div>
	        
	        <!-- 제작 연도 -->
	        <div class="form-group">
	            <label for="prdtYear">제작 연도:</label>
	            <input type="text" class="input_field" id="prdtYear" name="prdtYear" placeholder="제작 연도">
	        </div>
	        
	        <!-- 제작 국가 -->
	        <div class="form-group">
	            <label for="nations">제작 국가:</label>
	            <input type="text" class="input_field" id="nations" name="nations" placeholder="제작 국가 (복수 국가 시, 쉼표(,)로 구분)">
	        </div>
	        
	        <!-- 제작사 -->
	        <div class="form-group">
	            <label for="companys">제작사:</label>
	            <input type="text" class="input_field" id="companys" name="companys" placeholder="제작사 (복수 제작사 시, 쉼표(,)로 구분)">
	        </div>
	        
			<div class="form-group">
			  <label>장르:</label>
			  <div class="genres-box">
			    <div class="row">
			      <label><input type="checkbox" name="genres" value="드라마"> 드라마</label>
			      <label><input type="checkbox" name="genres" value="코미디"> 코미디</label>
			      <label><input type="checkbox" name="genres" value="멜로/로맨스"> 멜로/로맨스</label>
			      <label><input type="checkbox" name="genres" value="스릴러"> 스릴러</label>
			      <label><input type="checkbox" name="genres" value="미스터리"> 미스터리</label>
			      <label><input type="checkbox" name="genres" value="공포(호러)"> 공포(호러)</label>
			      <label><input type="checkbox" name="genres" value="어드벤처"> 어드벤처</label>
			      <label><input type="checkbox" name="genres" value="범죄"> 범죄</label>
			      <label><input type="checkbox" name="genres" value="가족"> 가족</label>
			      <label><input type="checkbox" name="genres" value="판타지"> 판타지</label>
			      <label><input type="checkbox" name="genres" value="SF"> SF</label>
			      <label><input type="checkbox" name="genres" value="서부극(웨스턴)"> 서부극(웨스턴)</label>
			      <label><input type="checkbox" name="genres" value="사극"> 사극</label>
			      <label><input type="checkbox" name="genres" value="애니메이션"> 애니메이션</label>
			      <label><input type="checkbox" name="genres" value="다큐멘터리"> 다큐멘터리</label>
			      <label><input type="checkbox" name="genres" value="전쟁"> 전쟁</label>
			      <label><input type="checkbox" name="genres" value="뮤지컬"> 뮤지컬</label>
			      <label><input type="checkbox" name="genres" value="공연"> 공연</label>
			      <label><input type="checkbox" name="genres" value="기타"> 기타</label>
			    </div>
			  </div>
			</div>
			 
			<!-- 배우 -->
	        <div class="form-group">
	            <label for="actors">배우:</label>
	            <input type="text" class="input_field" id="actors" name="actors" placeholder="배우 (쉼표(,)로 구분)">
	        </div>
      
	        <!-- 개봉일 -->
	        <div class="form-group">
	            <label for="openDt">개봉일:</label>
	            <input type="text" class="input_field" id="openDt" name="openDt" placeholder="개봉일">
	        </div>
        
	        <!-- 감독 -->
	        <div class="form-group">
	            <label for="directors">감독:</label>
	            <input type="text" class="input_field" id="directors" name="directors" placeholder="감독 (복수 감독 시, 쉼표(,)로 구분)">
	        </div>
	        
	        <!-- 상영 시간 -->
	        <div class="form-group">
	            <label for="showtime">상영시간:</label>
	            <input type="text" class="input_field" id="showtime" name="showtime" placeholder="상영시간">
	        </div><br>
	        
	        <!-- 관람 등급 -->
	        <div class="form-group">
	            <label for="watchGradeNm">관람 등급:</label>
	            <select name="watchGradeNm">
	                <option value="00" disabled selected>-- 선택 --</option>
	                <option value="전체관람가">전체관람가</option>
	                <option value="12세이상관람가">12세 이상 관람가</option>
	                <option value="15세이상관람가">15세 이상 관람가</option>
	                <option value="청소년관람불가">청소년 관람 불가</option>
	            </select>
	        </div><br>
	        
	        <!-- 줄거리 -->
	        <div class="form-group">
	            <label for="overview">줄거리:</label>
	            <textarea class="input_content" id="overview" cols="100" rows="500" name="overview" placeholder="1000자 이내로 줄거리를 입력하세요"></textarea>
	        </div>
        
			<input type="hidden" class="input_field" id="uploadCheck" name="uploadCheck" value="Y">
   		</form>
   		
   		<input type="button" id="btnRegister" class="btn_write" value="영화 업로드">
