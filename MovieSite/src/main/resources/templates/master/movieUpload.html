<style>

.boardView {
  width:70%;
  height:auto;
  margin:auto;
  text-align: left;
  padding: 60px;
  background-color:#FFFFFF;
  border:3px solid gray;
  border-radius: 4px;
}

.main {
  text-align: center;
}

.form-group {
  display: flex;
  align-items: center;
  margin: 12px 0;
}

.form-group label {
  width: 20%;  /* 라벨의 너비 설정 */
  font-size: 15px;
  margin-right: 1px;  /* 라벨과 input 필드 사이의 간격 */
  text-align: left;  /* 라벨 텍스트 우측 정렬 */
}

.input_field {
  width: 78%;
  border:none;
  border-bottom: 2px solid #adadad;
  margin: 14px 0;
  padding: 9px;
  outline:none;
  color: #636e72;
  font-size:15px;
  height:25px;
  background: none;
  box-sizing: border-box;
}

.imageZone {
	border: 2px solid #92AAB0;
	width: 60%;
	height: auto;
	color: #92AAB0;
	text-align: center;
	vertical-align: middle;
	margin: auto;
	padding: 10px 10px;
	font-size: 150%;
}

.input_content{
  width: 85%;
  height: 200px;
  margin: 15px;
  padding: 15px;
  box-sizing: border-box;
  border: 2px solid #adadad;
  font-size: 15px;
  resize: both;
}

.btn_write  {
  position:relative;
  left:50%;
  transform: translateX(-50%);
  margin-top: 20px;
  margin-bottom: 10px;
  width:40%;
  height:40px;
  background: #4dbf00;
  background-position: center;
  background-size: 150%;
  color:white;
  font-weight: bold;
  border:none;
  cursor:pointer;
  transition: 0.4s;
  display:inline;
}

.btn_write > a:hover, .btn_write > a:active {
	background-color: #F08080;
	text-decoration: none;
}

.genres-box {
  width : 75%;
  border: 2px solid #adadad;  /* 박스 테두리 색상 */
  padding: 15px;  /* 박스 내부 여백 */
  margin: 10px 0;  /* 박스 위아래 여백 */
  border-radius: 5px;  /* 박스 모서리 둥글게 */
  background-color: #f9f9f9;  /* 박스 배경 색상 */
}

.genres-box label {
  margin-right: 15px;  /* 각 체크박스 간격 */
}

.genres-box input[type="checkbox"] {
  margin-right: 5px;  /* 체크박스와 텍스트 간격 */
}

.genres-box .row {
  display: flex;
  flex-wrap: wrap;  /* 여러 줄로 나누기 */
}

.genres-box .row label {
  width: 20%;  /* 한 줄에 두 개씩 표시 */
  margin-bottom: 10px;  /* 항목 간 간격 */
  box-sizing: border-box;  /* padding, margin이 포함되게 */
}

</style>

<script>
window.onload = () => {
	var imgCheck = "N";
	var posterZone = document.querySelector('#posterZone');
    var posterFile = document.querySelector('#posterFile');
    var backgroundZone = document.querySelector('#backgroundZone');
    var backgroundFile = document.querySelector('#backgroundFile');
    var btnRegister = document.querySelector('#btnRegister');
	
 	// 포스터 및 백그라운드 이미지 클릭 시 파일 선택 이벤트
    posterZone.addEventListener('click', () => posterFile.click());
    backgroundZone.addEventListener('click', () => backgroundFile.click());
    
    // 파일 선택 시 이미지 미리보기 표시
    posterFile.addEventListener('change', (e) => showImage(e.target.files, posterZone));
    backgroundFile.addEventListener('change', (e) => showImage(e.target.files, backgroundZone));

	
    const showImage = (files, zone) => {
        const imgFile = files[0];
        if (imgFile && imgFile.type.indexOf("image") >= 0) {
            const reader = new FileReader();
            reader.onload = (event) => {
                zone.innerHTML = "<img src='" + event.target.result + "' style='width:350px;height:auto'>";
            };
            reader.readAsDataURL(imgFile);
            imgCheck = "Y";
        } else {
            alert("이미지 파일만 업로드하세요");
        }
    };
	
	
	btnRegister.addEventListener('click', async ()=> {
		
		//유효성 검사
		if(imgCheck == 'N') {alert("영화 포스터 이미지를 등록하세요"); return false;}	
		if(title.value == '') {alert("영화제목(국문)을 입력하세요."); title.focus(); return false;}
		if(originalTitle.value == '') {alert("영화제목(원어)을 입력하세요."); originalTitle.focus(); return false;}
		if(releaseDate.value == '') {alert("개봉일을 입력하세요."); releaseDate.focus(); return false;}
		if(runtime.value == '') {alert("상영 시간을 입력하세요."); runtime.focus(); return false;}
		if(productionCountries.value == '') {alert("제작 국가를 입력하세요."); productionCountries.focus(); return false;}
		if(productionCompanies.value == '') {alert("제작사를 입력하세요."); productionCompanies.focus(); return false;}
		//if(actors.value == '') {alert("배우를 입력하세요."); actors.focus(); return false;}
		if(overview.value == '') {alert("줄거리를 입력하세요."); overview.focus(); return false;}
		//if(directors.value == '') {alert("감독을 입력하세요."); directors.focus(); return false;}
		
		const genres = document.querySelectorAll('input[name=genres]:checked'); //유사 배열
		const certification = document.querySelector('select[name=watchGradeNm] option:checked');
		if(genres.length == 0) { alert('장르를 선택하세요.'); return false; }
		if(certification.value == '00') { alert('관람등급을 선택하세요.'); return false; }
		
		
		const formData = new FormData(UploadForm);
		
		await fetch('/master/movieUpload', {
			method: 'POST',
			body: formData	
		}).then((response)=> response.json())
		  .then((data)=> {
			  if(data.message === 'good'){
				  alert("영화 등록이 완료되었습니다.");
				  document.location.href='/master/memberRequest?page=1';
			  } else {
				  alert('서버 장애로 영화 업로드에 실패했습니다.');
			  }
		  }).catch((error) => {
			  console.log("error=" + error);
		  });	  
		});
}

</script>

</head>

	        <!-- 영화 포스터 업로드 영역 -->

	        </div>
	        
	        <!-- 영화 제목 (원어) -->

	            <label for="originalTitle">영화 제목(원어):</label>
	            <input type="text" class="input_field" id="originalTitle" name="originalTitle" placeholder="영화 제목(영어) (예: Harry Potter and the Philosopher's Stone)">
	        </div>
	        
	        <!-- 개봉일 -->
	        <div class="form-group">

	        </div>
	        
	        <!-- 언어 -->

	            <input type="text" class="input_field" id="originalLanguage" name="originalLanguage" placeholder="언어">
	        </div>
	        
	        
	        <!-- 줄거리 -->
	        <div class="form-group">
	            <label for="overview">줄거리:</label>
	            <textarea class="input_content" id="overview" cols="100" rows="500" name="overview" placeholder="1000자 이내로 줄거리를 입력하세요"></textarea>
	        </div>
	        
	        
	        <!-- 상영 시간 -->
	        <div class="form-group">
	            <label for="runtime">상영시간 (분):</label>
	            <input type="text" class="input_field" id="runtime" name="runtime" placeholder="상영시간 (분 단위로 숫자만 입력하세요)">
	        </div><br>
	        
	        <!-- 관람 등급 -->
	        <div class="form-group">
	            <label for="certification">관람 등급:</label>

	        </div><br>

			      <label><input type="checkbox" name="genres" value="SF"> SF</label>
			      <label><input type="checkbox" name="genres" value="서부"> 서부</label>
