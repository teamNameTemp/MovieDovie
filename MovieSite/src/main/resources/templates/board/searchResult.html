<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/searchResultStyle.css">
    <title th:text="${keyword} + ' 검색 결과'">검색 결과</title>
    <th:block th:replace="~{/fragments/header::header}"></th:block>
    <script src="/js/searchResult.js"></script>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{/fragments/nav/menubar::menubar}"></div>
    <div th:replace="~{/fragments/nav/sidebar::sidebar}"></div>
    
    <header>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="검색어를 입력하세요" th:value="${keyword}">
            <button class="search-button" onclick="search()">검색</button>
        </div>
        <div class="sort-options">
            <label>정렬 기준:</label>
            <div class="tab-container">
                <button class="tab-button active" onclick="sortResults('latest')">최신순</button>
                <button class="tab-button" onclick="sortResults('accuracy')">정확도 순</button>
            </div>
            <button onclick="toggleView('list')">목록형</button>
            <button onclick="toggleView('album')">앨범형</button>
        </div>
    </header>
    
    <main>
        <div class="results" id="results">
            <h2 th:text="${keyword} + '에 대한 검색 결과'"></h2>
            <th:block th:if="${#lists.isEmpty(results)}">
                <p>검색 결과가 없습니다.</p>
            </th:block>
            <th:block th:unless="${#lists.isEmpty(results)}">
                <div class="result-item" th:each="item : ${results}" th:class="${viewType}" style="display: flex;  ">
                    <div class="movie-details">
                        <div class="movie-header">
                            <span class="age-rating" th:text="${item.ageRating}">연령등급</span> | 
                            <a th:href="@{/board/movieDetail(title=${item.id})}" class="result-title" th:text="${item.title}"></a>
                        </div>
                        <div class="movie-info">
                            <span class="genre" th:text="${item.genre}">장르</span> | 
                            <span class="release-date" th:text="${item.releaseDate}">개봉년월</span> | 
                            <span class="actors" th:text="${item.actors}">배우</span>
                        </div>
                        <div class="movie-snippet" th:text="${item.snippet}"></div>
                    </div>
                </div>
            </th:block>
        </div>
    </main>

    <footer>
        <div class="pagination">
            <a th:href="@{/board/searchResult(page=${page - 1}, keyword=${keyword})}" class="page-link" th:if="${page > 1}">이전</a>
            <span th:text="${page}"></span>
            <a th:href="@{/board/searchResult(page=${page + 1}, keyword=${keyword})}" class="page-link" th:if="${page < totalPages}">다음</a>
        </div>
    </footer>

</body>
</html>
