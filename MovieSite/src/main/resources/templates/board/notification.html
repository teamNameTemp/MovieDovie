<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    <title>알림</title>

	<script>
	
	window.onload = function() {
	    // 갯수 업데이트 함수
	    function updateNotificationCount() {
	        const dropdownItems = document.querySelectorAll('.dropdown-content .dropdown-item'); // 드롭다운 항목들을 다시 선택
	        const notificationCount = document.getElementById('notification-count'); // 갯수를 표시할 요소
	        let itemCount = dropdownItems.length; // 항목 수를 가져옴
	        
	        // 항목 수가 4 이상일 경우 4+로 표시
	        if (itemCount >= 5) {
	            notificationCount.textContent = '4+';
	        } else {
	            notificationCount.textContent = itemCount;
	        }
	    }
	    // 초기 항목 갯수 표시
	    updateNotificationCount();
	    
	    
	    // 알림 삭제 아이콘 클릭 시
        document.querySelectorAll('.deleteicon').forEach(function(deleteIcon) {
            deleteIcon.addEventListener('click', function(event) {
                // 삭제하려는 알림의 seqno 값 가져오기
                const seqno = event.target.getAttribute('data-seqno');

                // 알림 삭제를 위한 POST 요청 보내기
                const formData = new FormData();
                formData.append('seqno', seqno);

                fetch('/deleteNoti', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (response.ok) {
                        // 서버에서 삭제 처리 성공 시 알림 UI에서 해당 항목 제거
                        const notificationItem = document.getElementById(`noti-item-${seqno}`);
                        if (notificationItem) {
                            notificationItem.remove();  // 삭제된 알림 제거
                        }
                        // 알림 갯수 업데이트
                        updateNotificationCount();
                    } else {
                        alert("알림 삭제에 실패했습니다.");
                    }
                })
                .catch(error => {
                    console.error('삭제 실패:', error);
                    alert('알림 삭제 중 오류가 발생했습니다.');
                });
            });
        });
	}
	

    
	document.addEventListener('DOMContentLoaded', function() {
	    // 모든 알림 항목에 클릭 이벤트 리스너 추가
	    document.querySelectorAll('.dropdown-item').forEach(function(notiItem) {
	        notiItem.addEventListener('click', function(event) {
	        	preventDefault();
	        	
	            // 클릭된 알림의 seqno 값을 가져오기
	            const seqno = event.currentTarget.getAttribute('data-seqno');
	            console.log('seqno:', seqno); // seqno 값 확인

	            // URLSearchParams로 변경하여 데이터를 전송
	            const params = new URLSearchParams();
	            params.append('seqno', seqno);

	            // 읽음 처리 POST 요청
	            fetch('/notiIsRead', {
	                method: 'POST',
	                body: params
	            })
	            .then(response => {
	                if (response.ok) {
	                    // 읽음 처리 성공 시 UI 변경
	                    const notiItem = document.getElementById(`noti-item-${seqno}`);
	                    if (notiItem) {
	                        // UI에서 읽음 상태로 변경
	                        notiItem.querySelector('.content').classList.add('read'); // 스타일을 통해 읽음 처리 (예: 색상 변경)
	                        notiItem.querySelector('.date').classList.add('read'); // 날짜에도 동일한 스타일 적용
	                    }
	                } else {
	                    alert('알림 읽음 처리 실패');
	                }
	            })
	            .catch(error => {
	                console.error('알림 읽음 처리 실패:', error);
	                alert('알림 읽음 처리 중 오류가 발생했습니다.');
	            });
	        });
	    });
	});
	
	
	
	</script>
	<style>
		.dropdown-item {
		    display: flex;            /* Flexbox로 항목을 배치 */
		    align-items: center;      /* 세로로 가운데 정렬 */
		    border-bottom: 1px solid #ddd;  /* 아랫쪽에 회색 선 추가 */
		}
		
		.noti-icon {
			padding-left: 9px;
		    width: 20px;             /* 아이콘의 크기 */
		    height: 20px;            /* 아이콘의 크기 */
		}
		
		.deleteicon {
		    position: absolute;  /* 부모 요소를 기준으로 절대 위치 */
		    top: 10px;           /* 부모 요소 상단에서 10px 떨어진 위치 */
		    right: 10px;         /* 부모 요소 오른쪽에서 10px 떨어진 위치 */
		    width: 13px;         /* 아이콘 크기 */
		    cursor: pointer;     /* 클릭 가능한 커서로 변경 */
		}
		
		.deleteicon:hover {
		    transform: scale(1.3);  /* 아이콘 크기를 1.3배로 확대 */
		    opacity: 0.7; 
		}
		
		.noti-text {
		    position: relative;  /* 삭제 아이콘을 기준으로 위치를 설정하기 위해 상대적인 위치 설정 */
		    display: flex;
		    flex-direction: column;  /* 내용은 세로로 쌓기 */
		    width: 100%;             /* noti-text가 부모의 100% 너비를 차지하게 설정 */
		    overflow: hidden;        /* 내용이 넘치지 않도록 처리 */
		    padding-right: 17px;
		}

		.content {
		    font-size: 12px;         /* 알림 내용 폰트 크기 */
		    margin-bottom: 5px;      /* 내용과 날짜 사이 간격 */
		    color: black;             /* 글자 색 */
		}
		
		.date {
		    font-size: 10px;         /* 날짜 폰트 크기 */
		    color: #999;             /* 날짜 색상 */
		}
		
		.content-read {
		    font-size: 13px;         /* 알림 내용 폰트 크기 */
		    margin-bottom: 5px;      /* 내용과 날짜 사이 간격 */
		    color: #C2C1BF;             /* 글자 색 */
		}
		
		.date-read {
		    font-size: 11px;         /* 날짜 폰트 크기 */
		    color: #C2C1BF;             /* 날짜 색상 */
		}
		
		.dropdown-content{
		  /*display : none;   여기 주석은 향후 없애기 hover 하면 보이게끔 하려고 하심..*/
		  position : absolute;
		  z-index : 1; /*다른 요소들보다 앞에 배치*/
		  font-weight: 400;
		  background-color:  #fcfcfc;
		  min-width : 150px;
		  margin-bottom: 30px;
		}
		
		.dropdown-content a{
		  display: flex;
		  flex-direction: column;  /* 내용은 세로로 쌓기 */
		  text-decoration : none;
		  color : rgb(37, 37, 37);
		  font-size: 12px;
		  padding : 10px;
		}
		
		/* .dropdown-item에 호버 효과 추가*/
		.dropdown-content .dropdown-item:hover {
		    background-color: #f1f1f1; /* 전체 배경색 변경 */
		}
	
		.dropdown:hover .dropdown-content {
		  display: block;
		}
		
	</style>
</head>

<body>

	<div class="bell-box">
		<i class="fas fa-bell" style="position:relative; font-size:20px; margin-top:15px; margin-bottom:15px; margin-left:10px;margin-right:25px;"></i>
		<p id="notification-count"></p>
	</div>
	<div class="dropdown-content">
		 <div th:if="${noti != null and noti.size() > 0}">
		    <div th:each="noti : ${noti}">
		        <div class="dropdown-item" th:id="'noti-item-' + ${noti.seqno}" th:data-seqno="${noti.seqno}"> <!-- 각 알림에 고유 ID 추가 -->
		            <th:block th:if="${#strings.equals(noti.is_read, 'N')}"> <!-- 안읽은 알람은 검정으로 -->
		                <th:block th:if="${#strings.equals(noti.notitype, 'completed')}">
		                    <img class="noti-icon" src="/img/noti_completed.png" alt="">
		                </th:block>
		                <th:block th:if="${#strings.equals(noti.notitype, 'reply')}">
		                    <img class="noti-icon" src="/img/noti_reply.png" alt="">
		                </th:block>
		                <div class="noti-text">
		                    <a th:href="@{'/board/requestView?seqno=' + ${noti.requestEntity.getSeqno()} + '&page=1'}">
		                        <b><span class="content" th:text="${noti.content}"></span></b>
		                        <span class="date" th:text="${#temporals.format(noti.created_at, 'yyyy-MM-dd HH:mm:ss')}"></span>
		                    </a>
		                    <!-- 삭제 아이콘 추가 -->
		                    <img class="deleteicon" src="/img/noti_delete.png" alt="삭제 아이콘" 
		                         th:attr="data-seqno=${noti.seqno}" />
		                </div>
		            </th:block>
		
		            <th:block th:if="${#strings.equals(noti.is_read, 'Y')}"> <!-- 이미 읽은 알람은 회색으로 -->
		                <th:block th:if="${#strings.equals(noti.notitype, 'completed')}">
		                    <img class="noti-icon" src="/img/noti_completed_read.png" alt="">
		                </th:block>
		                <th:block th:if="${#strings.equals(noti.notitype, 'reply')}">
		                    <img class="noti-icon" src="/img/noti_reply_read.png" alt="">
		                </th:block>
		                <div class="noti-text">
		                    <a th:href="@{'/board/requestView?seqno=' + ${noti.requestEntity.getSeqno()} + '&page=1'}">
		                        <b><span class="content-read" th:text="${noti.content}"></span></b>
		                        <span class="date-read" th:text="${#temporals.format(noti.created_at, 'yyyy-MM-dd HH:mm:ss')}"></span>
		                    </a>
		                    <!-- 삭제 아이콘 추가 -->
		                    <img class="deleteicon" src="/img/noti_delete.png" alt="삭제 아이콘" 
		                         th:attr="data-seqno=${noti.seqno}" />
		                </div>
		            </th:block>
		        </div>
		    </div>
	    </div>
	    <div th:if="${noti == null or noti.size() == 0}">
	        <div class="noti-text">알람이 없습니다</div>
	    </div>
	    
	</div>

</body>
</html>
