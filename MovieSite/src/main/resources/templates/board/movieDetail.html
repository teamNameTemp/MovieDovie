<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/movieDetailStyle.css">
<link rel="stylesheet" href="/css/movieListStyle.css">
<link
	href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&family=Sen:wght@400;700;800&display=swap"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
<title th:text="${movie.info.title}">영화 상세</title>
<th:block th:replace="~{/fragments/header::header}"></th:block>
<script src="/js/detail.js" defer></script>

</head>
<style>


.action-buttons {
    display: flex;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.action-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.1);
    border: none;
    border-radius: 20px;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s ease;
}

.action-btn i {
    font-size: 1.2em;
}

.action-btn span {
    font-size: 0.9em;
}

.action-btn .count {
    margin-left: 4px;
    opacity: 0.7;
}

/* 호버 효과 */
.action-btn:hover {
    background: rgba(255, 255, 255, 0.2);
}

/* 활성화 상태 */
.action-btn.active {
    background: #e50914;
}

/* 개별 버튼 스타일 */
.action-btn.watched.active {
    background: #1e88e5;
}

.action-btn.like.active {
    background: #4caf50;
}

.action-btn.dislike.active {
    background: #f44336;
}

.action-btn.bookmark.active {
    background: #ffc107;
    color: #000;
}

/* 반응형 스타일 */
@media (max-width: 768px) {
    .action-buttons {
        flex-wrap: wrap;
        gap: 10px;
    }
    
    .action-btn {
        flex: 1 1 calc(50% - 10px);
        justify-content: center;
    }
}

@media (max-width: 480px) {
    .action-btn {
        flex: 1 1 100%;
    }
}
</style>

<body>
	
	<div th:replace="~{/fragments/nav/menubar::menubar}"></div>
	<div th:replace="~{/fragments/nav/sidebar::sidebar}"></div>

	<div class="container">
		<!-- 영화 정보 -->
		<div class="featured-content featured-background"
			th:style="'background: linear-gradient(to left, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.8) 70%, rgba(0, 0, 0, 0.8) 100%), url(https://image.tmdb.org/t/p/original' + ${movie.info.backdropPath} + '); background-size: cover; background-position: 20% center; display: flex; align-items: flex-start;'">
			<div class="featured-desc"
				style="flex: 1; padding-right: 5%; padding-right: 40%;">
				<p class="#" style="font-size: small; color: white;">
					<!-- 제목위 미니정보 -->
					<span th:text="${movie.info.certification}"></span>
					<span th:each="genre, iterStat : ${movie.genre}"
						th:text="${genre.name} + (iterStat.last ? '' : ' · ')"></span> <span
						th:text="'  |  ' +${movie.info.runtime + '분'}"></span> <span
						th:text="'  |  ' + ${#temporals.format(movie.info.releaseDate, 'yyyy-MM-dd')}"></span>
				</p>
				<!-- 제목위 미니정보 -->
				<h1 class="featured-title" th:text="${movie.info.title}"
					style="display: inline;"></h1>
				<span class="original-title" th:text="${movie.info.originalTitle}"
					style="font-size: smaller; display: inline;"></span>
				<button style="width: 50px; height: auto;">수정</button>
				<br>
				<p th:text="${movie.info.tagline}"></p>
				<hr>
				<br>
				<p th:text="${movie.info.overview}"></p>

				<h2>
					TMDB 평점: <span th:text="${movie.info.voteAverage}"></span> (투표 수: <span
						th:text="${movie.info.voteCount}"></span>)
				</h2>
			</div>	
			<aside class="poster-container">
				<!-- 포스터 + 버튼 영역 -->
				<img th:if="${movie.info.posterPath}"
					th:src="${'https://image.tmdb.org/t/p/w200' + movie.info.posterPath}"
					th:alt="${movie.info.title}"> <br> <span
					th:if="${#lists.size(movie.video) > 0}"> <a
					th:href="@{'https://www.youtube.com/watch?v=' + ${movie.video[0].key}}"
					target="_blank" style="color: white; text-decoration: none;">
						<button class="btn-trailer">
							<i class="fab fa-youtube"></i>
							<p style="color: white;">트레일러 보기</p>
						</button>
				</a>
				</span> <input type="button" class="featured-button" value="장바구니 담기 | 가격">
			</aside>
			
			
		</div>
		

	<!-- button action -->
	<div class="featured-content">

			<div class="action-buttons">
				<button class="action-btn watched"
					th:classappend="${watch != null and watch.status == 'Y'} ? 'active' : ''">
					<i class="fas fa-eye"></i> <span>봤어요</span> <span 
					class="count"
					th:text="${watches != null and watches.count != null} ? ${watches.count} :'0'"></span>
				</button>
				<button class="action-btn like"
					th:classappend="${like != null and like.like == 'Y'} ? 'active' : ''">
					<i class="fas fa-thumbs-up"></i> <span>좋아요</span> <span
						class="count"
						th:text="${likes != null and likes.likeCount != null} ? ${likes.likeCount} : '0'">
						0 </span>
				</button>

				<button class="action-btn dislike"
					th:classappend="${like != null and like.dislike == 'Y'} ? 'active' : ''">
					<i class="fas fa-thumbs-down"></i> <span>싫어요</span> <span
						class="count"
						th:text="${likes != null and likes.dislikeCount != null} ? ${likes.dislikeCount} : '0'">
						0 </span>
				</button>
				<button class="action-btn bookmark"
					th:classappend="${bookmark != null and bookmark.status == 'Y'} ? 'active' : ''">
					<i class="fas fa-bookmark"></i> <span>북마크</span> <span
						class="count"
						th:text="${bookmarks != null and bookmarks.count != null} ? ${bookmarks.count} : '0'">0</span>
				</button>
			</div>


			<div class="review-container">
				<div class="review-form">
					<textarea id="reviewText" class="review-input"
						placeholder="이 영화에 대한 감상을 작성해주세요..."></textarea>
					<button id="submitReview" class="submit-btn">리뷰 등록</button>
				</div>
				<div id="reviewList" class="review-list">
					<!-- 리뷰들이 여기에 추가됩니다 -->
				</div>
			</div>
		</div>

		<div class="featured-content-others">
			<div class="featured-content-others">
				<div class="section-title">
					<h3>출연/제작</h3>
					<br>
					<br>
				</div>
				<div class="movie-list">
					<div class="scroll-container">
						<!-- 감독을 먼저 표시 -->
						<div th:each="crewMember : ${movie.crew}"
							th:if="${crewMember.jobTitle == 'Director'}"
							class="person-card director">
							<div class="card">
								<img th:if="${crewMember.profilePath}"
									th:src="@{'https://image.tmdb.org/t/p/w200' + ${crewMember.profilePath}}"
									th:alt="${crewMember.name + ' Profile'}"> <img
									th:unless="${crewMember.profilePath}"
									src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png"
									th:alt="${crewMember.name + ' Profile'}">
								<h4 th:text="${crewMember.name}"></h4>
								<p th:text="${crewMember.jobTitle}"></p>
							</div>
						</div>

						<!-- 출연진 표시 -->
						<div
							th:each="actor : ${#lists.size(movie.cast) > 9 ? movie.cast.subList(0, 10) : movie.cast}"
							class="person-card">
							<div class="card">
								<img th:if="${actor.profilePath}"
									th:src="@{'https://image.tmdb.org/t/p/w200' + ${actor.profilePath}}"
									th:alt="${actor.name + ' Profile'}"> <img
									th:unless="${actor.profilePath}"
									src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png"
									th:alt="${actor.name + ' Profile'}">
								<h4 th:text="${actor.name}"></h4>
								<p th:text="${actor.characterName}"></p>
							</div>
						</div>

					</div>
				</div>
			</div>
</div>


			<!-- 포토/포스터 이미지 -->
			<div class="featured-content-others">
				<div class="cast-crew-tabs">
					<div class="tab-container">
						<button id="backdropButton" class="tab-button active">포토</button>
						<button id="posterButton" class="tab-button">포스터</button>
					</div>
				</div>
				<div id="backdropSection" class="movie-list" style="display: block;">
					<div class="scroll-container">
						<div
							th:each="backdrop, iterStat : ${#lists.size(movie.backdrops) > 9 ? movie.backdrops.subList(0, 10) : movie.backdrops}"
							class="image-card">
							<div class="card">
								<img th:if="${backdrop.filePath}"
									th:src="@{'https://image.tmdb.org/t/p/original' + ${backdrop.filePath}}"
									th:alt="backdrop"
									style="width: 640px; height: 360px; clear: both;">
							</div>
						</div>
						<div th:if="${#lists.size(movie.backdrops) > 10}"
							class="more-button-container">
							<a href="/all-backdrops" class="more-button">더보기</a>
						</div>
					</div>
				</div>

				<div id="posterSection" class="movie-list" style="display: none;">
					<div class="scroll-container">
						<div
							th:each="poster, iterStat : ${#lists.size(movie.posters) > 9 ? movie.posters.subList(0, 10) : movie.images.posters}"
							class="image-card">
							<div class="card">
								<img th:if="${poster.filePath}"
									th:src="@{'https://image.tmdb.org/t/p/original' + ${poster.filePath}}"
									th:alt="'Poster Image'" style="width: 320px; height: 480px;">
							</div>
						</div>
						<div th:if="${#lists.size(movie.posters) > 10}"
							class="more-button-container">
							<a href="/all-posters" class="more-button">더보기</a>
						</div>
					</div>
				</div>
			</div>

			<div class="featured-content-others">
				<h2>추천 영화</h2>
				<div class="movie-list-item" th:each="movie : ${fear}">
					<a th:href="@{/board/movieDetail(movieId=${movie.id})}"> <img
						class="movie-list-item-img"
						th:src="${'https://image.tmdb.org/t/p/original' + movie.backdropPath}"
						alt="">
					</a> <span class="movie-list-item-title" th:text="${movie.title}"></span>
					<p class="movie-list-item-desc" th:text="${movie.overview}"></p>
				</div>
			</div>
		</div>
		</body>
</html>
