<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/movieDetailStyle.css">
    <title th:text="${movie.title}">영화 상세</title>
    <th:block th:replace="~{/fragments/header::header}"></th:block>
    <script src="/js/detail.js"></script>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{/fragments/nav/menubar::menubar}"></div>
    <div th:replace="~{/fragments/nav/sidebar::sidebar}"></div>
    
    <div class="container"> <!-- 영화 정보 -->
        <div class="featured-content featured-background" th:style="'background: url(https://image.tmdb.org/t/p/original' + ${movie.backdropPath} + '); background-size: cover; background-position: 20% center; background-repeat: no-repeat; display: flex; align-items: flex-start;'">
            <div class="featured-desc" style="flex: 1; padding-right: 45%;">
                <p class="#" style="font-size: small; color: white;"> <!-- 제목위 미니정보 -->
                    <span th:each="releaseInfo : ${movie.releaseDates.results}" th:if="${releaseInfo.iso31661 == 'KR'}">
                        <span th:if="${#lists.size(releaseInfo.releaseDates) > 0}" 
                                th:text="${releaseInfo.releaseDates[0].certification}" 
                                class="badge bg-primary me-1"></span>
                    </span>
                    <span th:each="genre, iterStat : ${movie.genres}" th:text="${genre.name} + (iterStat.last ? '' : ' · ')"></span>
                    <span th:text="'  |  ' +${movie.runtime + '분'}"></span>
                    <span th:text="'  |  ' + ${#temporals.format(movie.releaseDate, 'yyyy-MM-dd')}"></span>
                </p> <!-- 제목위 미니정보 -->
                <h1 class="featured-title" th:text="${movie.title}"></h1>
                <span class="original-title" th:text="${movie.originalTitle}" style="font-size: smaller;"></span> <br>
                <p th:text="${movie.tagline}"></p>
                <hr><br>
                <p th:text="${movie.overview}"></p>
                
                <h2>TMDB 평점: <span th:text="${movie.voteAverage}"></span> (투표 수: <span th:text="${movie.voteCount}"></span>)</h2>
                <div></div>
            </div>
            <aside class="poster-container"> <!-- 포스터 + 버튼 영역 -->
                <div class="action-buttons">
                    <button class="btn btn-light">공유</button>
                    <button class="btn btn-danger">찜</button>
                </div>
                <img th:if="${movie.posterPath}" 
                     th:src="${'https://image.tmdb.org/t/p/w200' + movie.posterPath}" 
                     th:alt="${movie.title}"> <br>
                <span th:if="${#lists.size(movie.videos.results) > 0}">
                    <a th:href="@{'https://www.youtube.com/watch?v=' + ${movie.videos.results[0].key}}" target="_blank" style="color: white; text-decoration: none;">
                        <button class="featured-button">
                            <i class="fab fa-youtube"></i> 트레일러 보기
                        </button>
                    </a>
                </span> <br><br>
                <input type="button" class="featured-button" value="장바구니 담기 | 가격">
            </aside>
        </div>

        <div class="featured-content">
            <div>
                <ul>
                    <li>
                        <a href="/all-actors" class="more-button">더 보기 ></a>
                    </li>
                    <li>
                        <a href="/all-crew" class="more-button">더 보기 ></a>
                    </li>
                </ul>
            </div>

            <div class="castCrewButton">
                <button id="castButton" class="toggle-button">출연</button>
                <button id="crewButton" class="toggle-button">제작진</button>
            </div>  
            <br><hr>
            <div id="castSection" class="movie-list" style="display: block;"> <!-- 초기상태: 표시 -->
                <div th:each="actor, iterStat : ${#lists.size(movie.credits.cast) > 9 ? movie.credits.cast.subList(0, 9) : movie.credits.cast}" class="movie-list-item-img" style="display: inline-block; width: 150px; margin-right: 10px;">
                    <div class="card">
                        <img th:if="${actor.profilePath}" th:src="@{'https://image.tmdb.org/t/p/w200' + ${actor.profilePath}}" th:alt="${actor.name + ' Profile'}" style="width: 100%; object-fit: contain;">
                        <img th:unless="${actor.profilePath}" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" th:alt="${actor.name + ' Profile'}" class="person-image">
                        <h4 th:text="${actor.name}"></h4>
                        <p th:text="${actor.characterName}"></p>
                    </div>
                </div>
                <div th:if="${#lists.size(movie.credits.cast) > 9}">
                    <a href="/all-actors" class="more-button">더 보기 ></a>
                </div>
            </div>

            <div id="crewSection" class="movie-list" style="display: none;"> <!-- 초기상태: 숨김 -->
                <div th:each="crewMember, iterStat : ${#lists.size(movie.credits.crew) > 9 ? movie.credits.crew.subList(0, 9) : movie.credits.crew}" class="movie-list-item-img" style="display: inline-block; width: 150px; margin-right: 10px;">
                    <div class="card">
                        <img th:if="${crewMember.profilePath}" th:src="@{'https://image.tmdb.org/t/p/w200' + ${crewMember.profilePath}}" th:alt="${crewMember.name + ' Profile'}" style="width: 100%; object-fit: contain;">
                        <img th:unless="${crewMember.profilePath}" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" th:alt="${crewMember.name + ' Profile'}" class="person-image">
                        <h4 th:text="${crewMember.name}"></h4>
                        <p th:text="${crewMember.jobTitle}"></p>
                    </div>
                </div>
                <div th:if="${#lists.size(movie.credits.crew) > 9}">
                    <a href="/all-crew" class="more-button">더 보기 ></a>
                </div>
            </div>
        </div>

        <div class="featured-content">
            <h2>리뷰</h2>
            <button id="likeButton" class="btn btn-like">좋아요</button>
            <button id="dislikeButton" class="btn btn-dislike">싫어요</button>
            <div id="reviewSection" class="review-section" style="display: none;">
                <textarea id="reviewText" placeholder="감상평을 작성하세요..." rows="4"></textarea>
                <button id="submitReview" class="btn btn-primary">제출</button>
            </div>
        </div>
        
        <div class="featured-content">
            <h2>영상/이미지</h2>
            <div class="image-container">
            </div>
        </div>

        <div class="featured-content">
            <h2>추천 영화</h2>
            <div class="image-container">
                <ul th:if="${movie.recommendedMovies != null}">
                    <li th:each="recommendedMovie : ${movie.recommendedMovies}" th:text="${recommendedMovie.title}"></li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
