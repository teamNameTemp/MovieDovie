<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/movieDetailStyle.css">
    <title th:text="${movie.title}">영화 상세</title>
    <th:block th:replace="~{/fragments/header::header}"></th:block>
</head>
<body>
      <div th:replace="~{/fragments/nav/menubar::menubar}"></div>
    <div th:replace="~{/fragments/nav/sidebar::sidebar}"></div>
    
    <div class="container">
        <div class="content-container">
            <div class="featured-content" th:style="'background: linear-gradient(to bottom, rgba(0,0,0,0), #151515), url(https://image.tmdb.org/t/p/original' + ${movie.backdropPath} + ');'">
                <div class="featured-desc">
                    <h1 class="featured-title" th:text="${movie.title}"></h1>
                    <p th:text="${movie.tagline}"></p>
                    <p th:text="${movie.overview}"></p>
                    <p th:text="${#temporals.format(movie.releaseDate, 'yyyy-MM-dd')}"></p>
                    <p>평점: <span th:text="${movie.voteAverage}"></span> (투표 수: <span th:text="${movie.voteCount}"></span>)</p>
                </div>
                <div>
                    <input type="button" class="featured-button" value="장바구니 담기 | 가격">
                </div>
            </div>

            <div class="featured-desc">
                <h2>작품정보</h2>
                <p>줄거리: <span th:text="${movie.overview}"></span></p>
                <hr>
                <div class="movie-details">
                    <div class="detail-row">
                        <span class="detail-label">감독:</span>
                        <span class="detail-value"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">장르:</span>
                        <span class="detail-value">
                        <ul>
				    		<li th:each="genre : ${movie.genres}" th:text="${genre.name}"></li>
						</ul>
						</span>
                    </div>
                    
                </div>
            </div>

            <div>
                <h2 class="featured-desc">출연</h2>
                <div class="movie-list-wrapper">
                    <div class="movie-list">
                        <div th:each="actor : ${movie.credits.cast}" class="movie-list-item-img">
                            <img th:if="${actor.profilePath}" th:src="@{'https://image.tmdb.org/t/p/w200' + ${actor.profilePath}}" th:alt="${actor.name + ' Profile'}" style="width: 100%; object-fit: contain;">
                            <img th:unless="${actor.profilePath}" src="/path/to/default/image.jpg" th:alt="${actor.name + ' Profile'}" class="person-image">
                            <h4 th:text="${actor.name}"></h4>
                            <p th:text="${actor.characterName}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="featured-desc">제작진</h2>
                <div class="movie-list-wrapper">
                    <div class="movie-list">
                        <div th:each="crewMember : ${movie.credits.crew}" class="movie-list-item-img">
                            <img th:if="${crewMember.profilePath}" th:src="@{'https://image.tmdb.org/t/p/w200' + ${crewMember.profilePath}}" th:alt="${crewMember.name + ' Profile'}" style="width: 100%; object-fit: contain;">
                            <img th:unless="${crewMember.profilePath}" src="/path/to/default/image.jpg" th:alt="${crewMember.name + ' Profile'}" class="person-image">
                            <h4 th:text="${crewMember.name}"></h4>
                            <p th:text="${crewMember.jobTitle}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="featured-desc">리뷰</h2>
                <div th:each="review : ${movie.reviews}" class="review-item">
                    <h3 th:text="${review.author}"></h3>
                    <p th:text="${review.content}"></p>
                </div>
            </div>

            <div class="previewDiv">
                <h2 class="featured-desc">영상/이미지</h2>
                <div class="image-container">
                </div>
            </div>

            <div class="section">
                <h2 class="featured-desc">유사한 영화</h2>
                <div class="image-container">
                </div>
            </div>

            <div class="section">
                <h2 class="featured-desc">추천 영화</h2>
                <div class="image-container">
                </div>
            </div>
        </div>
    </div>
	<!-- 양식 -->
	 <table border="1">
        <thead>
            <tr>
                <th>Property Name</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Movie Code</td>
                <td th:text="${movie.id}"></td>
            </tr>
            <tr>
                <td>title</td>
                <td th:text="${movie.title}"></td>
            </tr>
            <tr>
                <td>original title</td>
                <td th:text="${movie.originalTitle}"></td>
            </tr>
            <tr>
                <td>tagline</td>
                <td th:text="${movie.tagline}"></td>
            </tr>
            <tr>
                <td>overview</td>
                <td th:text="${movie.overview}"></td>
            </tr>
            <tr>
                <td>runtime</td>
                <td th:text="${movie.runtime}"></td>
            </tr>
            <tr>
                <td>releaseDate</td>
                <td th:text="${movie.releaseDate}"></td>
            </tr>
            <tr>
                <td>genres</td>
                <td>
                    <ul>
                        <li th:each="genre : ${movie.genres}" th:text="${genre.name}"></li>
                    </ul>
                </td>
            </tr>
            <tr>
                <td>Companies</td>
                <td>
                    <ul>
                        <li th:each="company : ${movie.productionCompanies}" th:text="${company.name}"></li>
                    </ul>
                </td>
            </tr>
           <tr>
			    <td>관람등급</td>
			</tr>
            <tr>
		    <td>출연진</td>
		    <td>
		        <ul th:if="${movie.credits != null and movie.credits.cast != null and !movie.credits.cast.empty}">
		            <li th:each="actor : ${movie.credits.cast}" th:text="${actor.name + ' as ' + actor.characterName}"></li>
		        </ul>
		        <span th:if="${movie.credits == null or movie.credits.cast == null or movie.credits.cast.empty}">정보 없음</span>
		    </td>
			</tr>
		
			<tr>
			    <td>제작진</td>
			    <td>
			        <ul th:if="${movie.credits != null and movie.credits.crew != null and !movie.credits.crew.empty}">
			            <li th:each="member : ${movie.credits.crew}" th:text="${member.name + ' - ' + member.jobTitle}"></li>
			        </ul>
			        <span th:if="${movie.credits == null or movie.credits.crew == null or movie.credits.crew.empty}">정보 없음</span>
			    </td>
			</tr>
        </tbody>
    </table>
</body>
</html>
