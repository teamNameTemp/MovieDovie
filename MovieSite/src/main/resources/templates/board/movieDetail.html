<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/movieDetailStyle.css">
<link rel="stylesheet" href="/css/movieListStyle.css">
<link
	href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&family=Sen:wght@400;700;800&display=swap"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
<title th:text="${movie.title}">영화 상세</title>
<th:block th:replace="~{/fragments/header::header}"></th:block>
<script src="/js/detail.js" defer></script>

</head>
<body>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		const like = document.querySelector('#likeString');
		
	</script>
	<div th:replace="~{/fragments/nav/menubar::menubar}"></div>
	<div th:replace="~{/fragments/nav/sidebar::sidebar}"></div>

	<div class="container">
		<!-- 영화 정보 -->
		<div class="featured-content featured-background"
			th:style="'background: linear-gradient(to left, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.8) 70%, rgba(0, 0, 0, 0.8) 100%), url(https://image.tmdb.org/t/p/original' + ${movie.backdropPath} + '); background-size: cover; background-position: 20% center; display: flex; align-items: flex-start;'">
			<div class="featured-desc"
				style="flex: 1; padding-right: 5%; padding-right: 40%;">
				<p class="#" style="font-size: small; color: white;">
					<!-- 제목위 미니정보 -->
					<span th:each="releaseInfo : ${movie.releaseDates.results}"
						th:if="${releaseInfo.iso31661 == 'KR'}"> <span
						th:if="${#lists.size(releaseInfo.releaseDates) > 0}"
						th:text="${releaseInfo.releaseDates[0].certification}"
						class="badge bg-primary me-1"></span>
					</span> <span th:each="genre, iterStat : ${movie.genres}"
						th:text="${genre.name} + (iterStat.last ? '' : ' · ')"></span> <span
						th:text="'  |  ' +${movie.runtime + '분'}"></span> <span
						th:text="'  |  ' + ${#temporals.format(movie.releaseDate, 'yyyy-MM-dd')}"></span>
				</p>
				<!-- 제목위 미니정보 -->
				<h1 class="featured-title" th:text="${movie.title}"
					style="display: inline;"></h1>
				<span class="original-title" th:text="${movie.originalTitle}"
					style="font-size: smaller; display: inline;"></span>
				<button style="width: 50px; height: auto;">수정</button>
				<br>
				<p th:text="${movie.tagline}"></p>
				<hr>
				<br>
				<p th:text="${movie.overview}"></p>

				<h2>
					TMDB 평점: <span th:text="${movie.voteAverage}"></span> (투표 수: <span
						th:text="${movie.voteCount}"></span>)
				</h2>
			</div>
			<div class="action-buttons"
				style="position: absolute; top: 5%; right: 15%;">
				<button class="btn btn-light">공유</button>
				<button class="btn btn-danger">찜</button>
			</div>
			<aside class="poster-container">
				<!-- 포스터 + 버튼 영역 -->
				<img th:if="${movie.posterPath}"
					th:src="${'https://image.tmdb.org/t/p/w200' + movie.posterPath}"
					th:alt="${movie.title}"> <br> <span
					th:if="${#lists.size(movie.videos.results) > 0}"> <a
					th:href="@{'https://www.youtube.com/watch?v=' + ${movie.videos.results[0].key}}"
					target="_blank" style="color: white; text-decoration: none;">
						<button class="btn-trailer">
							<i class="fab fa-youtube"></i>
							<p style="color: white;">트레일러 보기</p>
						</button>
				</a>
				</span> <input type="button" class="featured-button" value="장바구니 담기 | 가격">
			</aside>
		</div>
	<!-- 좋아요/싫어요 -->
	<div class="featured-content">
			
			<div class="review-header" th:if="${like == null}">
				<button id="likeButton" class="btn btn-like">
					<i class="fas fa-thumbs-up"></i> 좋아요
				</button>
				<button id="dislikeButton" class="btn btn-dislike">
					<i class="fas fa-thumbs-down"></i> 싫어요
				</button>
				<p class="likeString">회원님은 선택하지 않았습니다.</p>
				</div>
			<div class="review-header" th:if="${like != null}">
				<button id="likeButton" class="btn btn-like" th:classappend="${like.likecheck == 'Y'} ? 'active' : ''">
					<i class="fas fa-thumbs-up"></i> 좋아요
				</button>
				<button id="dislikeButton" class="btn btn-dislike" th:classappend="${like.dislikecheck == 'Y'} ? 'active' : ''">
					<i class="fas fa-thumbs-down"></i> 싫어요
				</button>
				<p class="likeString">회원님은 [[${like.likecheck=='Y'? '좋아요':'싫어요'}]]를 선택하였습니다.</p>
			</div>
			
			
			<div class="review-container">
				<div class="review-form">
					<textarea id="reviewText" class="review-input"
						placeholder="이 영화에 대한 감상을 작성해주세요..."></textarea>
					<button id="submitReview" class="submit-btn">리뷰 등록</button>
				</div>
				<div id="reviewList" class="review-list">
					<!-- 리뷰들이 여기에 추가됩니다 -->
				</div>
			</div>
		</div>

		<div class="featured-content-others">
			<div class="cast-crew-tabs">
				<div class="tab-container">
					<button id="castButton" class="tab-button active">출연</button>
					<button id="crewButton" class="tab-button">제작진</button>
				</div>
			</div>
			<div id="castSection" class="movie-list" style="display: block;">
				<div class="scroll-container">
					<div
						th:each="actor, iterStat : ${#lists.size(movie.credits.cast) > 9 ? movie.credits.cast.subList(0, 10) : movie.credits.cast}"
						class="person-card">
						<div class="card">
							<img th:if="${actor.profilePath}"
								th:src="@{'https://image.tmdb.org/t/p/w200' + ${actor.profilePath}}"
								th:alt="${actor.name + ' Profile'}"> <img
								th:unless="${actor.profilePath}"
								src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png"
								th:alt="${actor.name + ' Profile'}">
							<h4 th:text="${actor.name}"></h4>
							<p th:text="${actor.characterName}"></p>
						</div>
					</div>
					<div th:if="${#lists.size(movie.credits.cast) > 15}"
						class="more-button-container">
						<a href="/all-actors" class="more-button">더보기</a>
					</div>
				</div>
			</div>

			<div id="crewSection" class="movie-list" style="display: none;">
				<div class="scroll-container">
					<div
						th:each="crewMember, iterStat : ${#lists.size(movie.credits.crew) > 9 ? movie.credits.crew.subList(0, 10) : movie.credits.crew}"
						class="person-card">
						<div class="card">
							<img th:if="${crewMember.profilePath}"
								th:src="@{'https://image.tmdb.org/t/p/w200' + ${crewMember.profilePath}}"
								th:alt="${crewMember.name + ' Profile'}"
								style="width: 100%; object-fit: contain;"> <img
								th:unless="${crewMember.profilePath}"
								src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png"
								th:alt="${crewMember.name + ' Profile'}" class="person-image">
							<h4 th:text="${crewMember.name}"></h4>
							<p th:text="${crewMember.jobTitle}"></p>
						</div>
					</div>
					<div th:if="${#lists.size(movie.credits.crew) > 15}"
						class="more-button-container">
						<a href="/all-crew" class="more-button">더보기</a>
					</div>
				</div>
			</div>
		</div>

	

		<!-- 백드롭/포스터 이미지 -->
		<div class="featured-content-others">
			<div class="cast-crew-tabs">
				<div class="tab-container">
					<button id="backdropButton" class="tab-button active">Backdrop</button>
					<button id="posterButton" class="tab-button">Poster</button>
				</div>
			</div>
			<div id="backdropSection" class="movie-list" style="display: block;">
				<div class="scroll-container">
					<div
						th:each="backdrop, iterStat : ${#lists.size(movie.images.backdrops) > 9 ? movie.images.backdrops.subList(0, 10) : movie.images.backdrops}"
						class="image-card">
						<div class="card">
							<img th:if="${backdrop.filePath}"
								th:src="@{'https://image.tmdb.org/t/p/original' + ${backdrop.filePath}}"
								th:alt="backdrop"
								style="width: 640px; height: 360px; clear: both;">
						</div>
					</div>
					<div th:if="${#lists.size(movie.images.backdrops) > 10}"
						class="more-button-container">
						<a href="/all-backdrops" class="more-button">더보기</a>
					</div>
				</div>
			</div>

			<div id="posterSection" class="movie-list" style="display: none;">
				<div class="scroll-container">
					<div
						th:each="poster, iterStat : ${#lists.size(movie.images.posters) > 9 ? movie.images.posters.subList(0, 10) : movie.images.posters}"
						class="image-card">
						<div class="card">
							<img th:if="${poster.filePath}"
								th:src="@{'https://image.tmdb.org/t/p/original' + ${poster.filePath}}"
								th:alt="'Poster Image'" style="width: 320px; height: 480px;">
						</div>
					</div>
					<div th:if="${#lists.size(movie.images.posters) > 10}"
						class="more-button-container">
						<a href="/all-posters" class="more-button">더보기</a>
					</div>
				</div>
			</div>
		</div>

		<div class="featured-content-others">
			<h2>추천 영화</h2>
			<div class="movie-list-item" th:each="movie : ${fear}">
				<a th:href="@{/board/movieDetail(movieId=${movie.id})}"> <img
					class="movie-list-item-img"
					th:src="${'https://image.tmdb.org/t/p/original' + movie.backdropPath}"
					alt="">
				</a> <span class="movie-list-item-title" th:text="${movie.title}"></span>
				<p class="movie-list-item-desc" th:text="${movie.overview}"></p>
			</div>
		</div>
	</div>
</body>
</html>
