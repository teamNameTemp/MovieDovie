<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">


<head>
	<style>
	@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
	</style>
	<script src="/js/app.js"></script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/movieListStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&family=Sen:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    <title>요청사항 작성</title>
    <style>
    .input_field {
	  width: 85%;
	  border:none;
	  border-bottom: 2px solid #adadad;
	  margin: 15px;
	  padding: 15px;
	  outline:none;
	  color: #636e72;
	  font-size:15px;
	  height:25px;
	  background: none;
	  box-sizing: border-box;
	}
	
	.input_content{
	  width: 85%;
	  height: 200px;
	  margin: 15px;
	  padding: 15px;
	  box-sizing: border-box;
	  border: 2px solid #adadad;
	  font-size: 15px;
	  resize: both;
	}
	
	.boardView {
	  width:60%;
	  height:auto;
	  margin:auto;
	  text-align: center;
	  padding: 60px;
	  background-color:white;
	  border: 2px solid #D8D8D8;
	  border-radius: 20px;
	}
	
	.main {
	  text-align: center;
	}
	
	.form-group {
	  display: flex;
	  align-items: center;
	  margin: 10px 0;
	}
	
	.form-group label {
	  width: 10%;  /* 라벨의 너비 설정 */
	  font-size: 16px;
	  margin-right: 1px;  /* 라벨과 input 필드 사이의 간격 */
	  text-align: left;  /* 라벨 텍스트 우측 정렬 */
	}

	.button {
	    display: inline-block;
	    padding: 10px 15px;
	    margin: 5px;
	   	font-size: 16px;
	    background-color: #4dbf00; /* 버튼 배경색 */
	    color: white; /* 글자색 */
	    text-align: center;
	    text-decoration: none;
	    border: none;
	    border-radius: 10px; /* 모서리 둥글게 */
	    transition: background-color 0.2s;
	}
	
	.button:hover {
	    background-color:black;
	}
	
	textarea::placeholder {
	    white-space: pre-wrap; /* 줄바꿈 처리 */
	    word-wrap: break-word; /* 긴 단어가 줄을 넘지 않도록 처리 */
	}
	
	textarea {
	  height: 100px;
	  line-height: 1.5;
	}
	
	
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-container">
            <div class="logo-container">
                <h1 class="logo">MovieDovie</h1>
            </div>
            <div class="menu-list">
                <ul class="menu-list">
                    <li class="menu-list-item active" style="position:relative; margin-top:16px;"><a href="#">홈</a></li>
                    <li class="menu-list-item" style="position:relative; margin-top:17px;"><a href="#">추천 영화</a></li>
                    <li class="menu-list-item" style="position:relative; margin-top:17px;"><a href="#">장르</a></li>
                    <li class="menu-list-item" style="position:relative; margin-top:17px;"><a href="#">인기 영화</a></li>         
                </ul>
              <div class="search-box" style="position:relative; margin-top:27px;">
  				<form action="/board/list" method="">
	    			<input class="search-txt" type="text" placeholder="  작품, 배우, 게시글, 태그를 검색해보세요" >
	    			<button class="search-btn" type="submit">
					  <i class="fas fa-search"></i>
				  	</button>
			 	</form>    
        	  </div>	  
			</div>
          <div class="profile-container">
          
            <div class="dropdown">
            
            <div class="bell-box">	
      				<i class="fas fa-bell" style="position:relative; font-size:20px; margin-top:15px; margin-bottom:15px; margin-left:10px;margin-right:25px;"></i>
      				<p id="notification-count"></p>
      				</div>
      				<div class="dropdown-content">
            			<a href="#" class="dropdown-item">새 알림 1</a>
			            <a href="#" class="dropdown-item">새 알림 2</a>
			            <a href="#" class="dropdown-item">새 알림 3</a>
			            <a href="#" class="dropdown-item">새 알림 4</a>
			            <a href="#" class="dropdown-item">새 알림 5</a>
                </div>
                
           </div>
           
           &nbsp;&nbsp;&nbsp;
            <div class="dropdown">
      				<img class="profile-picture" src="/img/profile.jpg" alt="">
      				<div class="dropdown-content">
      					<a href="/master/movieStats">사용자 통계 정보</a>
            			<a href="#">프로필 정보</a>
        				<a href="/member/logout">로그 아웃</a>
        				<a href="/board/selectGenre">내 선호 장르</a>
        				<a href="#">내 장바구니</a>
        				<a href="#">내 찜목록</a>
        				<a href="#">내 대여 현황</a>
                </div>
             </div>
                <div class="profile-text-container">
                  <div class="dropdown">
      				<button class="dropbtn"> 
        			<span class="fas fa-solid fa-caret-down"></span> 상세 메뉴</button>
      				<div class="dropdown-content">
      					<a href="#">구매 목록</a>
      				</div>
    			</div>
            </div>
                </div>
            
                <div class="toggle">
                    <i class="fas fa-moon toggle-icon"></i>
                    <i class="fas fa-sun toggle-icon"></i>
                    <div class="toggle-ball"></div>
                </div>
            </div>
        </div>
    <div class="sidebar">
        <a style="text-decoration:none" href="#" class="left-menu-icon fas fa-home"></a>
        <a style="text-decoration:none" href="#" class="left-menu-icon fas fa-bookmark"></a>
        <a style="text-decoration:none" href="#" class="left-menu-icon fas fa-shopping-cart"></a>
        <a style="text-decoration:none" href="#" class="left-menu-icon fas fa-user"></a>
    </div>
    <div class="main" style="background-color:black;">
        <br><br><br><br><br>
        <h2 style="text-align: center; color: white;">관리자에게 요청하기</h2>        <br><br>
        <div class="boardView">
	       	 	<div class="form-group">
		            <label for="writer">글쓴이:</label>
		            <input type="text" class="input_field" id="writer" name="writer" th:value="${nickname}" readonly>
		        </div>
		        <div class="form-group">
		            <label for="title">제목:</label>
		            <input type="text" class="input_field" id="title" name="title" placeholder="제목">
		        </div>
		        <div class="form-group">
		            <label for="content">내용:</label>
		            <textarea class="input_content" id="content" cols="100" rows="1000" name="content" placeholder="1000자 이내로 내용을 입력하세요."></textarea>
		        </div>
		        <br><p> 글 작성 이후 수정은 불가능하오니, 이 점 참고해주세요.</p><br>
	        <div id="bottom_menu">
			    <input type="button" id="btnRegister" class="button" value="등록"/>&nbsp;
			    <input type="button" id="btnCancel" class="button" value="취소"/>
			</div>
        </div><br><br><br>
    </div>
    
    
	<script>
	window.onload = () => {
		
		btnRegister.addEventListener('click', async ()=> {
			
			const title = document.getElementById("title");
			const content = document.getElementById("content");
			//유효성 검사
			if(title.value == '') {alert("제목을 입력하세요."); title.focus(); return false;}
			if(content.value == '') {alert("내용을 입력하세요."); content.focus(); return false;}
			
			await fetch('/board/requestWritePost', {
				method: 'POST',
	            headers: {'Content-Type': 'application/json'},
	            body: JSON.stringify({
	                title : title.value,
	                content: content.value,
	                email: '[[${email}]]',
	                status: 'PENDING'
	            })
			}).then((response)=> response.json())
			  .then((data)=> {
				  if(data.message === 'good'){
					  alert("요청사항 등록이 완료되었습니다.");
					  document.location.href='/board/requestView?seqno=' + '[[${maxSeqno}]]' + '&page=1&keyword='; 
				  } else {
					  alert('서버 장애로 요청사항 등록에 실패했습니다.');
				  }
			  }).catch((error) => {
				  console.log("error=" + error);
			  });	  
		});
		
	    const btnCancel = document.getElementById('btnCancel');
         
        btnCancel.addEventListener('click', () => {
            // /board/list 페이지로 이동
            window.location.href = '/board/requestList'; //향후 마이페이지 혹은 자신의 리스트로 변경 필요
        });
	}
	
	</script>
    
</body>



</html>
