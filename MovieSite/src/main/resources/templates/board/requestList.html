<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">


<head>
	<style>
	@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
	</style>
	<script src="/js/app.js"></script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/movieListStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&family=Sen:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    <title>요청사항 작성</title>
    <style>
    	.main {
		  text-align: center;
		}
		
		table {
		  border-collapse: collapse;
		  width: 800px;
		  margin: 1rem auto;
		  background-color: white;
		}
		
		/* 테이블 행 */
		th, td {
		  padding: 3px;
		  text-align: center;
		  border-bottom: 1px solid #ddd;
		  text-align: center;
		}
		
		th {
		  background-color: #1b1b1b;
		  color: #ddd;
		}
		
		/* 테이블 올렸을 때 */
		tbody tr:hover {
		  background-color: #d3d3d3;
		  opacity: 0.9;
		  cursor: pointer;
		}
		
		/* 테이블 비율 */
		th:nth-child(1),
		td:nth-child(1) {
		  width: 10%;
		}
		
		th:nth-child(2),
		td:nth-child(2) {
		  width: 45%;
		}
		
		th:nth-child(3),
		td:nth-child(3) {
		  width: 30%;
		}
		
		th:nth-child(4),
		td:nth-child(4) {
		  width: 15%;
		}
		
		tr:nth-child(even) {
		  background-color: #4dbf0010;
		}
		.button {
		    display: inline-block;
		    padding: 10px 15px;
		    margin: 5px;
		   	font-size: 14px;
		    background-color: #4dbf00; /* 버튼 배경색 */
		    color: white; /* 글자색 */
		    text-align: center;
		    text-decoration: none;
		    border-radius: 10px; /* 모서리 둥글게 */
		    transition: background-color 0.3s;
  			animation: animate 1s infinite;
		}
		
		.button:hover {
		    background-color:black;
		}
		
		@keyframes animate {
		  0% {opacity: 1;}
		  50% {opacity: 0.6;}
		  100% {opacity: 1;}
		}
	
		
    </style>
	<script>
		const search = () => {
			const keyword = document.querySelector('#keyword');
			document.location.href='/board/requestList?page=1&keyword=' + keyword.value;
		}
	
		const press = () => {
			if(event.keyCode == 13) search();
		}
		
	  	//게시물 작성
		const boardWrite = () => {
	    	document.location.href='/board/requestWrite';
		}
		
	</script>
</head>
<body>
    <div class="navbar">
        <div class="navbar-container">
            <div class="logo-container">
                <h1 class="logo">MovieDovie</h1>
            </div>
            <div class="menu-list">
                <ul class="menu-list">
                    <li class="menu-list-item active" style="position:relative; margin-top:16px;"><a href="#">홈</a></li>
                    <li class="menu-list-item" style="position:relative; margin-top:17px;"><a href="#">추천 영화</a></li>
                    <li class="menu-list-item" style="position:relative; margin-top:17px;"><a href="#">장르</a></li>
                    <li class="menu-list-item" style="position:relative; margin-top:17px;"><a href="#">인기 영화</a></li>         
                </ul>
              <div class="search-box" style="position:relative; margin-top:27px;">
  				<form action="/board/list" method="">
	    			<input class="search-txt" type="text" placeholder="  작품, 배우, 게시글, 태그를 검색해보세요" >
	    			<button class="search-btn" type="submit">
					  <i class="fas fa-search"></i>
				  	</button>
			 	</form>    
        	  </div>	  
			</div>
          <div class="profile-container">
          
            <div class="dropdown">
            
            <div class="bell-box">	
      				<i class="fas fa-bell" style="position:relative; font-size:20px; margin-top:15px; margin-bottom:15px; margin-left:10px;margin-right:25px;"></i>
      				<p id="notification-count"></p>
      				</div>
      				<div class="dropdown-content">
            			<a href="#" class="dropdown-item">새 알림 1</a>
			            <a href="#" class="dropdown-item">새 알림 2</a>
			            <a href="#" class="dropdown-item">새 알림 3</a>
			            <a href="#" class="dropdown-item">새 알림 4</a>
			            <a href="#" class="dropdown-item">새 알림 5</a>
                </div>
                
           </div>
           
           &nbsp;&nbsp;&nbsp;
            <div class="dropdown">
      				<img class="profile-picture" src="/img/profile.jpg" alt="">
      				<div class="dropdown-content">
      					<a href="/master/movieStats">사용자 통계 정보</a>
            			<a href="#">프로필 정보</a>
        				<a href="/member/logout">로그 아웃</a>
        				<a href="/member/selectGenre">내 선호 장르</a>
        				<a href="#">내 장바구니</a>
        				<a href="#">내 찜목록</a>
        				<a href="#">내 대여 현황</a>
                </div>
             </div>
                <div class="profile-text-container">
                  <div class="dropdown">
      				<button class="dropbtn"> 
        			<span class="fas fa-solid fa-caret-down"></span> 상세 메뉴</button>
      				<div class="dropdown-content">
      					<a href="#">구매 목록</a>
      				</div>
    			</div>
            </div>
                </div>
            
                <div class="toggle">
                    <i class="fas fa-moon toggle-icon"></i>
                    <i class="fas fa-sun toggle-icon"></i>
                    <div class="toggle-ball"></div>
                </div>
            </div>
        </div>
    <div class="sidebar">
        <a style="text-decoration:none" href="#" class="left-menu-icon fas fa-home"></a>
        <a style="text-decoration:none" href="#" class="left-menu-icon fas fa-bookmark"></a>
        <a style="text-decoration:none" href="#" class="left-menu-icon fas fa-shopping-cart"></a>
        <a style="text-decoration:none" href="#" class="left-menu-icon fas fa-user"></a>
    </div>
    <div class = "main">
	<br><br><br><br><br><h2>[[${nickname}]]님의 요청 사항</h2>
	
	<br>
	<input type="text" name="keyword" id="keyword" 
         		style="width:35%;height:28px;border:2px solid #4dbf00;font-size: 15px;border-radius:10px"
         		placeholder=" 검색할 제목 혹은 내용을 입력하세요." onkeydown="press()"> &nbsp;
    <input type="button" value="검색" 
             style="width:5%;height:30px;background:#4dbf00;color:white; border-radius:10px;border:none;font-weight:bold;cursor:pointer;"
             	onclick="search()">		
	<br><br>
		 
	<table class="table table-sm">
	  <thead class="table-light">
	    <tr>
	      <th scope="col">번호</th>
	      <th scope="col">제목</th>
	      <th scope="col">작성일</th>
	      <th scope="col">처리 상태</th>
	    </tr>
	  </thead>
	  <tbody>
	    <th:block th:if="${#strings.equals(listIsEmpty, 'N')}">   
            <tr th:each="list, index : ${list}">
                <td th:text="${totalElement - (page-1)*postNum - index.count + 1}"></td>
                <td style="text-align: center;">
                	<a th:href="@{'/board/requestView?seqno=' + ${list.seqno} + '&page=' + ${page} + '&keyword=' + ${keyword}}"
                   		onMouseover="this.style.textDecoration='underline'" 
                   		onMouseout="this.style.textDecoration='none'">
                   	<span th:text="${list.title}"></span>
                   	</a>
                </td>
                <td th:text="${#temporals.format(list.reqdate,'yyyy-MM-dd HH:mm:ss')}"></td>	                	
                <th:block th:if="${#strings.equals(list.status, 'PENDING')}"><td>처리 중</td></th:block>
                <th:block th:if="${#strings.equals(list.status, 'COMPLETED')}"><td>처리 완료</td></th:block>	
        	</tr>
        </th:block>
		<th:block th:if="${#strings.equals(listIsEmpty, 'Y')}">
			<td colspan="5">등록한 게시물이 없습니다.</td>
		</th:block>
	  </tbody>
	</table>
	<br>
	<div>[(${pageList})]</div>
	<br>
	<div>
		<a href="javascript:boardWrite()" class="button">요청 사항 작성하기!</a>
	</div>
	
</div>

    
</body>



</html>
