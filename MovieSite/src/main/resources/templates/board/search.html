<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'&quot;' + ${param.keyword} + '&quot; 검색 결과'">영화 검색</title>
    <th:block th:replace="~{/fragments/header::header}"></th:block>
    <link rel="stylesheet" href="/css/movieListStyle.css">
    <link rel="stylesheet" href="/css/searchResultStyle.css">
    <link href='https://fonts.googleapis.com/css?family=Play:400,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    

    <style>
        .search-container {
            text-align: center;
            margin-top: 100px;
        }
        .search-box {
            width: 300px;
            padding: 10px;
            font-size: 16px;
        }
        .search-button {
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
    <script src="/js/searchResult.js"></script>

</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{/fragments/nav/menubar::menubar}"></div>
    <div th:replace="~{/fragments/nav/sidebar::sidebar}"></div>
    
    <div class="search-container">
        <h1 th:text="'&quot;' + ${param.keyword} + '&quot; 검색 결과'">검색 결과</h1>
            <input type="text"
                    id="searchKeyword"
                    placeholder="작품, 배우 등 키워드를 입력하세요"
                    onkeyup="if(event.keyCode === 13) searchMovies()">
            <button onclick="searchMovies()">검색</button>
    </div>

    <div id="searchResult" class="movie-grid">
        <div th:each="movie : ${movies}">
            <div class="movie-card">
                <img th:src="@{${movie.poster_path} != null ? 'https://image.tmdb.org/t/p/w200' + ${movie.poster_path} : '/images/blankPoster.jpg'}" alt="${movie.title}">
                <h3 th:text="${movie.title}"></h3>
                <p th:text="${movie.release_date} != null ? ${movie.release_date} : '개봉일 미정'"></p>
            </div>
        </div>
    </div>

    <script>
        
    </script>

</body>
</html>
