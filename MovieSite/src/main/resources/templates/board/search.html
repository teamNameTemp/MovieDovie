<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'&quot;' + ${param.keyword} + '&quot; 검색 결과'">영화 검색</title>
    <th:block th:replace="~{/fragments/header::header}"></th:block>
    <link rel="stylesheet" href="/css/movieListStyle.css">
    <link rel="stylesheet" href="/css/searchResultStyle.css">
    <link href='https://fonts.googleapis.com/css?family=Play:400,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">

    <script src="/js/searchResult.js"></script>
    <script>
        const search = () => {
            const keyword = document.querySelector('#keyword');
            document.location.href='/board/search?page=1&keyword=' + keyword.value;
        }

        const press = () => {
            if(event.keyCode == 13) search();
        }
    </script>
    

</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{/fragments/nav/menubar::menubar}"></div>
    <div th:replace="~{/fragments/nav/sidebar::sidebar}"></div>
    
    <div class="search-container" style="margin-top: 100px; text-align: center;">
        <h1 th:text="'&quot;' + ${param.keyword} + '&quot; 검색 결과'">검색 결과</h1>

        <div class="movie-grid">
            <div th:each="movie : ${movies}">
                <div class="movie-card">
                    <a th:href="@{/board/movieDetail(movieId=${movie.id})}"> <img
                        th:src="${'https://image.tmdb.org/t/p/original' + movie.posterPath}"
                        alt="">
                    </a>
                    <h3 th:text="${movie.title}"></h3>
                    <p th:text="${movie.releaseDate} != null ? ${movie.releaseDate} : '개봉일 미정'"></p>
                </div>
            </div>
        </div>

        <th:block th:if="${list != null}">     
            <tr th:each="list,index:${list}">
                <!-- totalElement, postNum, page, index.count -->
                <td th:text="${totalElement - (page-1)*postNum - index.count + 1}"></td>
                <td style="text-align: left;">
                    <a th:href="@{'/board/search?seqno=' + ${list.seqno} + '&page=' + 
                            ${page} + '&keyword=' + ${keyword}}">
                    <span th:text="${list.title}"></span>
                    </a>
                </td>
            </tr>
        </th:block>
        <th:block th:if="${list == null}">
            <td colspan="5">등록된 게시물이 없습니다.</td>
        </th:block>
        <br>
        <div>[(${pageList})]</div>
    </div>


</body>
</html>
