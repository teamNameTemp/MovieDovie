<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'&quot;' + ${keyword} + '&quot; 검색 결과'">영화 검색</title>
    <th:block th:replace="~{/fragments/header::header}"></th:block>
    <link rel="stylesheet" href="/css/searchResultStyle.css">

    <style>
        .search-container {
            text-align: center;
            margin-top: 100px;
        }
        .search-box {
            width: 300px;
            padding: 10px;
            font-size: 16px;
        }
        .search-button {
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>

</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{/fragments/nav/menubar::menubar}"></div>
    <div th:replace="~{/fragments/nav/sidebar::sidebar}"></div>
    
    <div class="search-container">
        <h1>검색 결과</h1>
            <input type="text"
                    id="searchKeyword"
                    placeholder="작품, 배우 등 키워드를 입력하세요"
                    onkeyup="if(event.keyCode === 13) searchMovies()">
            <button onclick="searchMovies()">검색</button>
    </div>

    <div id="searchResult" class="movie-grid">
        <!--검색결과 추가-->
    </div>

    <script>
        function searchMovies() {
            const keyword = document.getElementById("searchKeyword").value;
            if (!keyword.trim()) {
                alert("검색어를 입력하세요");
                return;
            }

            fetch('/board/search/movies', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `keyword=${encodeURIComponent(keyword)}`
            })
            .then(response => response.json())
            .then(movies => {
                const resultsDiv = document.getElementById('searchResult');
                resultsDiv.innerHTML = '';

                movies.forEach(movie => {
                    const card = `
                    <div class ="movie-card">
                        <img src="https://image.tmdb.org/t/p/w500${movie.posterPath}" 
                            alt="${movie.title}"
                            onerror="this.src = 'MovieSite\src\main\resources\static\images\blankProfile.jpg'"
                        >
                        <h3>${movie.title}</h3>
                        <p>${movie.releaseDate || '개봉일 미정'}</p>
                        </div>
                    `;
                    resultsDiv.innerHTML += card;// +=를 사용해서 검색 결과를 하나씩 추가
                });
            })
        }
    </script>



</body>
</html>
