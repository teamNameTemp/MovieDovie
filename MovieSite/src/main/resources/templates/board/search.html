<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'&quot;' + ${param.keyword} + '&quot; 검색 결과'">영화 검색</title>
    <th:block th:replace="~{/fragments/header::header}"></th:block>
    <link rel="stylesheet" href="/css/movieListStyle.css">
    <link rel="stylesheet" href="/css/searchResultStyle.css">
    <link href='https://fonts.googleapis.com/css?family=Play:400,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    
    <script src="/js/searchResult.js"></script>
    <script>
        const search = () => {
            const keyword = document.querySelector('#keyword');
            document.location.href='/board/search?page=1&keyword=' + keyword.value;
        }

        const press = () => {
            if(event.keyCode == 13) search();
        }
    </script>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{/fragments/nav/menubar::menubar}"></div>
    <div th:replace="~{/fragments/nav/sidebar::sidebar}"></div>
    
<div class="search-container" style="margin-top: 100px; text-align: center;">
    <h1 th:text="'&quot;' + ${param.keyword} + '&quot; 검색 결과'" style="margin-bottom: 20px;">검색 결과</h1>

    <div id="searchResult" class="movie-grid"> 
        <div th:each="movie:${movies}">
            <a th:href="@{/board/movieDetail(movieId=${movie.id})}"> 
                <div class="movie-card">
                    <img th:src="@{${movie.posterPath} != null ? 'https://image.tmdb.org/t/p/w200' + ${movie.posterPath} : '/images/blankPoster.jpg'}" alt="${movie.title}">
                    <h3 class="truncate" th:text="${movie.title}" alt="${movie.title}"></h3>
                    <p th:text="${movie.releaseDate} != null ? ${movie.releaseDate} : '개봉일 미정'"></p>
                </div>
                <div class="movie-info-layer">
                    <h3 class="truncate" th:text="${movie.title}" th:alt="${movie.title}"></h3>
                    <p class="movie-details">
                        <p th:text="${movie.releaseDate} != null ? ${movie.releaseDate} : '개봉일 미정'"></p>
                        <p th:each="genre : ${movie.genre}" th:text="${genre.genreNm}"></p>
                    </p>
                </div>
            </a>
        </div>
    </div>

   	<div th:each="movie:${movies}">
   	<div th:text="${movie.id}"></div>
   	<div th:text="${movie.title}"></div>
   	<div th:text="${movie.certification}"></div>
   	<div th:text="${movie.runtime}"></div>
   	<div th:each="genre : ${movie.genre}" th:text="${genre.genreNm}"></div>
   	<div th:text="${movie.releaseDate}"></div>
   	<div th:text="${movie.posterPath}"></div>
   	<hr>
   	</div>
        
    </div>

    <div id="loadMoreContainer" style="margin-top: 20px;">
        <button id="loadMoreBtn" onclick="loadMore()" th:style="${movies.size() <= 1 ? 'display: none;' : ''}">
            더 보기
        </button>
        </div>
    </div>
</body>
</html>
