<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'&quot;' + ${param.keyword} + '&quot; 검색 결과'">영화 검색</title>
    <th:block th:replace="~{/fragments/header::header}"></th:block>
    <link rel="stylesheet" href="/css/movieListStyle.css">
    <link rel="stylesheet" href="/css/searchResultStyle.css">
    <link href='https://fonts.googleapis.com/css?family=Play:400,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">

    <script src="/js/searchResult.js"></script>
    <script>
        const search = () => {
            const keyword = document.querySelector('#keyword');
            document.location.href='/board/search?page=1&keyword=' + keyword.value;
        }

        const press = () => {
            if(event.keyCode == 13) search();
        }
    </script>
    
    <style>
        .search-container {
            text-align: center;
            margin-top: 100px;
        }
        .search-box {
            width: 300px;
            padding: 10px;
            font-size: 16px;
        }
        .search-button {
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>

</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{/fragments/nav/menubar::menubar}"></div>
    <div th:replace="~{/fragments/nav/sidebar::sidebar}"></div>
    
    <div class="search-container" style="margin-top: 100px; text-align: center;">
        <h1 th:text="'&quot;' + ${param.keyword} + '&quot; 검색 결과'">검색 결과</h1>

    <div id="searchResult" class="movie-grid">
        <!--검색결과 추가-->
    </div>

    <script>
        function searchMovies() {
            const keyword = document.getElementById("searchKeyword").value;
            if (!keyword.trim()) {
                alert("검색어를 입력하세요");
                return;
            }

            fetch('/board/search/movies', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `keyword=${encodeURIComponent(keyword)}`
            })
            .then(response => response.json())
            .then(movies => {
                const resultsDiv = document.getElementById('searchResult');
                resultsDiv.innerHTML = '';
                //console.log(movies);
                movies.forEach(movie => {
                    const card = `
                    <div class ="movie-card">
                        <img src="${movie.poster_path ? 'https://image.tmdb.org/t/p/w200' + movie.poster_path : '/images/blankPoster.jpg'}" 
                            alt="${movie.title}">
                        <h3>${movie.title}</h3>
                        <p>${movie.release_date || '개봉일 미정'}</p>
                        </div>
                    `;
                    resultsDiv.innerHTML += card;// +=를 사용해서 검색 결과를 하나씩 추가
                });
            })
        }
    </script>

</body>
</html>
