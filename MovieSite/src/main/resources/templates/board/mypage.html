<!DOCTYPE HTML>

<style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        /* 기본 스타일 */
        body {
            margin: 0;
            font-family: 'Jua', sans-serif;
            background-color: #151515;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 프로필 영역 */
        .myprofile-container {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap; /* 반응형을 위해 flex-wrap을 사용 */
            margin-top: 100px;
            margin-right: 200px;
            margin-bottom: 100px;
        }

        /* 프로필 사진 */
        .myprofile-picture {
            border-radius: 50%;
            overflow: hidden;
            width: 300px;
            height: 300px;
            background-color: white;
            margin: 0 auto;
            flex-shrink: 0; /* 이미지 크기가 줄어들지 않도록 설정 */
        }

        .myprofile-picture img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 프로필 정보 */
        .profile-info {
            margin-left: 50px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; 
        }

        .profile-info h2,
        .profile-info p {
            margin: 10px 0;
        }

        .profile-info h2 {
            font-size: 1.5em;
            color: #fff;
        }

        .profile-info p {
            color: #bbb;
            font-size: 1em;
        }

      
	@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
	</style>
