<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <style>
      /* 모달 기본 스타일 */
      .modal {
        display: none; /* 기본적으로 숨겨짐 */
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); /* 반투명 배경 */
        z-index: 1500;
      }

      /* 모달 콘텐츠 스타일 */
      .modal-content {
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        width: 80%; /* 너비를 80%로 설정 */
        max-width: 800px; /* 최대 너비를 설정하여 너무 커지지 않도록 */
        max-height: 400px;
        position: absolute;
        color: #000;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%); /* 화면 중앙으로 이동 */
        overflow-y: auto;
      }

      .modal-content::-webkit-scrollbar {
        width: 10px; /* 스크롤바 너비 설정 */
        height: 10px;
      }

      .modal-content::-webkit-scrollbar-thumb {
        background-color: gray;
        border-radius: 10px;
      }

      /* 닫기 버튼 스타일 */
      .close-btn {
        color: #aaa;
        font-size: 28px;
        font-weight: bold;
        float: right;
        cursor: pointer;
      }

      .close-btn:hover,
      .close-btn:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
      }

      /* 대여 현황 박스 스타일 */
      .rental-status-box {
        background-color: #333;
        padding: 20px;
        border-radius: 10px;
        cursor: pointer;
        text-align: center;
      }

      .rental-status-box h3,
      .rental-status-box p {
        color: #fff;
      }

      /* 표 스타일 */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      table,
      th,
      td {
        border: 1px solid #ddd;
      }

      th,
      td {
        padding: 10px;
        text-align: center;
      }

      th {
        background-color: #f2f2f2;
      }

      .profile-status-box {
        margin-top: 50px;
        background-color: #fffafa;
        position: absolute;
        top: 100px; /* 상단에서 20px 떨어진 위치 */
        right: 50%; /* 우측에서 20px 떨어진 위치 */
        z-index: 500;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* 그림자 효과 */
        width: 500px;
        height: 443px;
        color: #151515; /* 텍스트 색상 */
        opacity: 1;
        text-align: center;
      }

      .profile-status-box:hover {
        opacity: 1;
      }

      .profile-status-box h3 {
        margin: 0;
        font-size: 28px;
        font-weight: bold;
      }

      .profile-status-box p {
        margin: 5px 0;
        font-size: 28px;
      }

      /* 프로필 사진을 원형으로 만들기 위한 스타일 */
      .profile-status-box .profile-img {
        width: 200px;
        height: 200px;
        border-radius: 50%; /* 원형으로 */
        object-fit: cover; /* 이미지 비율 유지 */
        margin-bottom: 10px; /* 이미지와 텍스트 사이의 간격 */
      }

      /* 프로필 이름 스타일 */
      .profile-status-box .profile-name {
        font-size: 30px;
        font-weight: bold;
      }
      /*대여 정보 박스*/
      .rental-status-box {
        margin-top: 50px;
        background-color: gray;
        position: fixed;
        top: 20px; /* 상단에서 20px 떨어진 위치 */
        right: 20px; /* 우측에서 20px 떨어진 위치 */
        z-index: 500;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* 그림자 효과 */
        width: 200px;
        color: #fff; /* 텍스트 색상 */
        z-index: 1500;
        opacity: 0.6;
      }

      .rental-status-box:hover {
        opacity: 1;
      }

      .rental-status-box h3 {
        margin: 0;
        font-size: 18px;
        font-weight: bold;
      }

      .rental-status-box p {
        margin: 5px 0;
        font-size: 14px;
      }

      /* 유저 상태 정보 박스 */
      .user-status-box {
        margin-top: 50px;
        background-color: white;
        position: absolute;
        top: 100px;
        right: 20%;
        z-index: 300;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* 그림자 효과 */
        width: 400px; /* 표와 텍스트를 충분히 담을 크기로 설정 */
        color: #151515; /* 텍스트 색상 */
        opacity: 1;
      }

      .user-status-box:hover {
        opacity: 1;
      }

      .user-status-box h3 {
        margin: 0;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 10px;
      }

      .user-info-table {
        width: 100%;
        border-collapse: collapse;
      }

      .user-info-table th,
      .user-info-table td {
        padding: 8px;
        text-align: center;
        border-bottom: 1px solid #ddd;
      }

      .user-info-table th {
        width: 30%; /* 항목, 정보 칸을 동일한 비율로 설정 */
        background-color: none;
      }

      .user-info-table td {
        width: 70%;
        color: #151515;
      }

      .user-info-table tr:hover {
        background-color: rgba(
          255,
          255,
          255,
          0.1
        ); /* 행을 hover했을 때 배경 색 변경 */
      }
      /* 기본 스타일 */
      body {
        margin: 0;
        font-family: "Jua", sans-serif;
        background-color: #151515;
        color: #fff;
      }

      .container {
        max-width: 1920px;
        margin-left: 50px;
        margin-top: 50px;
      }

      /* 프로필 영역 */
      .myprofile-container {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        flex-wrap: wrap; /* 반응형을 위해 flex-wrap을 사용 */
        padding: 0 20px;
        overflow-x: auto;
      }

      .myprofile-container::-webkit-scrollbar {
        width: 10px; /* 스크롤바 너비 설정 */
        height: 10px;
      }

      .myprofile-container::-webkit-scrollbar-thumb {
        background-color: gray;
        border-radius: 10px;
      }
      /* 프로필 사진 */
      .myprofile-picture {
        margin-top: 100px;
        margin-left: 100px;
        margin-bottom: 100px;
        border-radius: 50%;
        overflow: hidden;
        width: 300px;
        height: 300px;
        background-color: white;
        flex-shrink: 0; /* 이미지 크기가 줄어들지 않도록 설정 */
      }

      .myprofile-picture img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* 프로필 정보 */
      .profile-info {
        margin-left: 50px;
        background-color: none;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        color: #fff;
      }

      .profile-info h2 {
        margin: 0;
        font-size: 24px;
        color: #fff;
      }

      .profile-info p {
        margin: 5px 0;
        color: #bbb;
      }

      /*Mypage prorile*/
      .profile-mycontainer {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 20px; /* 프로필 영역 위에 여백 */
        padding: 20px;
        background-color: #000; /* 배경색을 좀 더 어두운 색으로 설정 */
        border-radius: 10px;
      }

      .profile-mypicture img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* 이미지 크기를 맞추면서 잘리게 처리 */
      }

      .profile-text-container {
        margin: 0 20px;
      }

      .profile-picture {
        width: 32px;
        height: 32px;
        margin-top: 6.5px;
        margin-bottom: 6.5px;
        border-radius: 50%;
        object-fit: cover;
      }

      .sidebar {
        width: 50px;
        height: 100%;
        background-color: black;
        position: fixed;
        top: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 60px;
      }

      .left-menu-icon {
        color: white;
        font-size: 20px;
        margin-bottom: 40px;
      }

      .content-container {
        margin-left: 0px;
      }

      .movie-list-container {
        border-radius: 30px;
        margin-left: 50px;
        padding: 0 20px;
        z-index: 500;
      }

      p.movie-list-item-desc {
        text-align: center;
      }

      .movie-list-wrapper {
        position: relative;
        overflow: hidden;
        display: flex;
        z-index: 500;
      }

      .movie-list {
        display: flex;
        align-items: center;
        height: 500px;
        padding: 0 20px;
        position: relative;
        transition: all 1s ease-in-out;
        z-index: 500;
        background-color: #151515;
        overflow-x: auto;
      }

      .movie-list::-webkit-scrollbar {
        width: 10px; /* 스크롤바 너비 설정 */
        height: 10px;
      }

      .movie-list::-webkit-scrollbar-thumb {
        background-color: gray;
        border-radius: 10px;
      }

      .movie-list-item {
        box-shadow: 0px 0px 30px 10px #151515;
        border-radius: 30px;
        background-color: #151515;
        margin-right: 30px;
        position: relative;
        z-index: 500;
      }

      .jua-regular {
        font-family: "Jua", sans-serif;
        font-weight: 400;
        font-style: normal;
      }

      .movie-list-item-img {
        border-radius: 30px;
        transition: all 1s ease-in-out;
        width: 202.5px;
        height: 300px;
        object-fit: cover;
        z-index: 0;
        cursor: pointer;
      }

      /* 개별 버튼 스타일 */
      .movie-list-item-button {
        padding: 0 10px;
        color: inherit; /* 기본 색상 유지 */
        border-radius: 50%;
        outline: none;
        border: none;
        opacity: 0;
        cursor: pointer;
        transition: color 0.3s ease-in-out;
      }

      .container.active {
        background-color: white;
      }

      a {
        text-align: center;
        text-decoration: none;
        color: inherit;
      }
    </style>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <div th:replace="~{/fragments/header :: header}"></div>
    <title>MyPage</title>
  </head>
  <body>
    <div th:replace="~{/fragments/nav/menubar::menubar}"></div>
    <div th:replace="~{/fragments/nav/sidebar::sidebar}"></div>

    <div class="container">
      <!-- 프로필 영역 -->
      <div
        class="myprofile-container"
        style="
          background-color: #4dbf00;
          background-image: url('/images/background.jpg');
          background-size: cover;
          background-position: center;
        "
      >
        <div class="profile-status-box">
          <p style="margin-bottom: 50px">
            [[${member.nickname}]]님의 프로필 사진
          </p>
          <img
            src="/images/img/profile.jpg"
            alt="Profile Image"
            class="profile-img"
          />
          <h3 class="profile-name" style="margin-bottom: 10px">
            [[${member.username}]]
          </h3>
        </div>
        <!-- 대여현황 박스 -->
        <div class="rental-status-box" id="rentalStatusBox">
          <h3>대여 현황</h3>
          <p
            th:text="${#lists.size(rents) == 0 ? '현재 대여 중인 영화가 없습니다.' : '현재 대여 중 : ' + #lists.size(rents)}"
          ></p>
        </div>

        <div id="rentalModal" class="modal">
          <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2>대여 리스트</h2>

            <!-- 대여 목록 표 -->
            <table>
              <thead>
                <tr>
                  <th>영화 이름</th>
                  <th>대여 만료 날짜</th>
                </tr>
              </thead>
              <tbody style="overflow-y: auto">
                <tr th:each="rent : ${rents}">
                  <td th:text="${rent.title}"></td>
                  <td
                    th:text="${#temporals.format(rent.returndate,'yyyy-MM-dd hh:mm')}"
                  ></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="user-status-box">
          <h3 th:text="${member.username + '의 정보'}"></h3>
          <table class="user-info-table">
            <tr>
              <th>이름</th>
              <td th:text="${member.username}"></td>
            </tr>
            <tr>
              <th>별명</th>
              <td th:text="${member.nickname}"></td>
            </tr>
            <tr>
              <th>성별</th>
              <td th:text="${member.gender}"></td>
            </tr>
            <tr>
              <th>전화번호</th>
              <td th:text="${member.telno}"></td>
            </tr>
            <tr>
              <th>회원 가입일</th>
              <td
                th:text="${#temporals.format(member.regdate, 'yyyy-MM-dd')}"
              ></td>
            </tr>

            <tr>
              <th>이메일</th>
              <td th:text="${member.email}"></td>
            </tr>
          </table>
        </div>

        <div
          class="movie-list-container"
          style="margin-left: 0px; margin-top: 600px"
        >
          <h1 class="movie-list-title" style="color: #4dbf00">
            대여 영화 리스트
          </h1>
          <div class="movie-list-wrapper">
            <div
              class="movie-list"
              style="background-color: transparent; background-image: none"
            >
              <div class="movie-list-item" th:each="movie : ${rents}">
                <a th:href="@{/board/movieDetail(movieId=${movie.id})}">
                  <img
                    class="movie-list-item-img"
                    th:src="${'https://image.tmdb.org/t/p/original' + movie.posterPath}"
                    alt=""
                  />
                </a>
                <p
                  class="movie-list-item-desc"
                  th:text="${#temporals.format(movie.returndate, 'yyyy-MM-dd hh:mm')}"
                ></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="movie-list-container">
      <h1 class="movie-list-title">북마크한 영화 리스트</h1>
      <div class="movie-list-wrapper">
        <div class="movie-list">
          <div class="movie-list-item" th:each="movie : ${bookmarks}">
            <a th:href="@{/board/movieDetail(movieId=${movie.id})}">
              <img
                class="movie-list-item-img"
                th:src="${'https://image.tmdb.org/t/p/original' + movie.posterPath}"
                alt=""
              />
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="movie-list-container">
      <h1 class="movie-list-title">내가 시청한 영화</h1>
      <div class="movie-list-wrapper">
        <div class="movie-list">
          <div class="movie-list-item" th:each="movie : ${watches}">
            <a th:href="@{/board/movieDetail(movieId=${movie.id})}">
              <img
                class="movie-list-item-img"
                th:src="${'https://image.tmdb.org/t/p/original' + movie.posterPath}"
                alt=""
              />
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="movie-list-container">
      <h1 class="movie-list-title">내가 좋아요 한 영화</h1>
      <div class="movie-list-wrapper">
        <div class="movie-list">
          <div class="movie-list-item" th:each="movie : ${likes}">
            <a th:href="@{/board/movieDetail(movieId=${movie.id})}">
              <img
                class="movie-list-item-img"
                th:src="${'https://image.tmdb.org/t/p/original' + movie.posterPath}"
                alt=""
              />
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      // HTML 요소들 선택
      const rentalStatusBox = document.getElementById("rentalStatusBox");
      const rentalModal = document.getElementById("rentalModal");
      const closeModal = document.getElementById("closeModal");

      // 대여 현황 박스를 클릭하면 모달 열기
      rentalStatusBox.addEventListener("click", function () {
        rentalModal.style.display = "block";
      });

      // 모달 닫기 버튼 클릭하면 모달 닫기
      closeModal.addEventListener("click", function () {
        rentalModal.style.display = "none";
      });

      // 모달 밖을 클릭하면 모달 닫기
      window.addEventListener("click", function (event) {
        if (event.target === rentalModal) {
          rentalModal.style.display = "none";
        }
      });
    </script>
  </body>
</html>
