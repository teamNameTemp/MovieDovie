<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>영화 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .movie-poster {
            max-width: 100px;
            max-height: 150px;
        }
        .modal-body img {
            max-width: 100%;
        }
        .modal-dialog {
            max-width: 80%;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">영화 목록</h1>
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>포스터</th>
                    <th>제목</th>
                    <th>개봉일</th>
                    <th>평점</th>
                    <th>상세정보</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="movie, iterStat : ${movies}">
                    <td>
                        <img th:if="${movie.posterPath}" 
                             th:src="${'https://image.tmdb.org/t/p/w200' + movie.posterPath}" 
                             th:alt="${movie.title}" 
                             class="movie-poster">
                    </td>
                    <td th:text="${movie.title}">영화 제목</td>
                    <td th:text="${#temporals.format(movie.releaseDate, 'yyyy-MM-dd')}">개봉일</td>
                    <td th:text="${#numbers.formatDecimal(movie.voteAverage, 1, 1) + ' (' + movie.voteCount + ' 투표)'}">평점</td>
                    <td>
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" th:data-bs-target="${'#movieModal' + iterStat.index}">
                            상세 정보
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal for each movie -->
    <div th:each="movie, iterStat : ${movies}" class="modal fade" th:id="${'movieModal' + iterStat.index}" tabindex="-1" aria-labelledby="movieModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="movieModalLabel" th:text="${movie.title}">영화 제목</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img th:if="${movie.posterPath}" th:src="${'https://image.tmdb.org/t/p/w500' + movie.posterPath}" th:alt="${movie.title}" class="mb-3">
                    <p><strong>원제:</strong> <span th:text="${movie.originalTitle}"></span></p>
                    <p><strong>태그라인:</strong> <span th:text="${movie.tagline}"></span></p>
                    <p><strong>줄거리:</strong> <span th:text="${movie.overview}"></span></p>
                    <p><strong>상영 시간:</strong> <span th:text="${movie.runtime + '분'}"></span></p>
                    <p><strong>배경 이미지:</strong> <span th:text="${movie.backdropPath}"></span></p>
                    <p><strong>원어:</strong> <span th:text="${movie.originalLanguage}"></span></p>
                    <p><strong>IMDB ID:</strong> <span th:text="${movie.imdbId}"></span></p>
                    <p><strong>인기도:</strong> <span th:text="${movie.popularity}"></span></p>
                    <p><strong>개봉일:</strong> <span th:text="${#temporals.format(movie.releaseDate, 'yyyy-MM-dd')}"></span></p>
                    <p><strong>평균 평점:</strong> <span th:text="${movie.voteAverage}"></span></p>
                    <p><strong>투표 수:</strong> <span th:text="${movie.voteCount}"></span></p>
                    <p><strong>상태:</strong> <span th:text="${movie.status}"></span></p>
                    <p><strong>비디오 여부:</strong> <span th:text="${movie.video ? '있음' : '없음'}"></span></p>
                    <p><strong>성인 영화 여부:</strong> <span th:text="${movie.adult ? '예' : '아니오'}"></span></p>
                    <p><strong>예산:</strong> <span th:text="${movie.budget}"></span></p>
                    <p><strong>홈페이지:</strong> <a th:href="${movie.homepage}" target="_blank" th:text="${movie.homepage}"></a></p>
                    <p><strong>수익:</strong> <span th:text="${movie.revenue}"></span></p>

                    <h6>제작사</h6>
                    <ul>
                        <li th:each="company : ${movie.productionCompanies}" th:text="${company.name + ' (' + company.originCountry + ')'}"></li>
                    </ul>

                    <h6>제작 국가</h6>
                    <ul>
                        <li th:each="country : ${movie.productionCountries}" th:text="${country.name}"></li>
                    </ul>

                    <h6>사용된 언어</h6>
                    <ul>
                        <li th:each="language : ${movie.spokenLanguages}" th:text="${language.name + ' (' + language.englishName + ')'}"></li>
                    </ul>

                    <h6>장르</h6>
                    <ul>
                        <li th:each="genre : ${movie.genres}" th:text="${genre.name}"></li>
                    </ul>

                    <h6 th:if="${movie.belongsToCollection != null}">소속 컬렉션</h6>
                    <p th:if="${movie.belongsToCollection != null}" th:text="${movie.belongsToCollection.name}"></p>

                    <h6>키워드</h6>
                    <ul th:if="${movie.keywords != null && movie.keywords.keywords != null}">
                        <li th:each="keyword : ${movie.keywords.keywords}" th:text="${keyword.name}"></li>
                    </ul>

                   <h6>비디오</h6>
                    <div th:if="${movie.videos != null && movie.videos.results != null}" class="d-flex flex-wrap">
                        <div th:each="video : ${movie.videos.results}" class="me-3 mb-3">
                            <a th:href="${'https://www.youtube.com/watch?v=' + video.key}" target="_blank">
                                <img th:src="${'https://img.youtube.com/vi/' + video.key + '/0.jpg'}" 
                                     th:alt="${video.name}" 
                                     class="video-thumbnail">
                                <p th:text="${video.name}" class="small"></p>
                            </a>
                        </div>
                    </div>

					<h6>한국 관람등급</h6>
					<ul th:if="${movie.releaseDates != null && movie.releaseDates.results != null}">
					    <li th:each="releaseInfo : ${movie.releaseDates.results}" th:if="${releaseInfo.iso31661 == 'KR'}">
					        <span th:each="releaseDate : ${releaseInfo.releaseDates}" 
					              th:text="${releaseDate.certification}" 
					              class="badge bg-primary me-1"></span>
					    </li>
					</ul>

                    <h6>출연진</h6>
                    <ul th:if="${movie.credits != null && movie.credits.cast != null}">
                        <li th:each="actor : ${movie.credits.cast}" th:text="${actor.name + ' as ' + actor.characterName}"></li>
                    </ul>

                    <h6>제작진</h6>
                    <ul th:if="${movie.credits != null && movie.credits.crew != null}">
                        <li th:each="crewMember : ${movie.credits.crew}" th:text="${crewMember.name + ' - ' + crewMember.jobTitle}"></li>
                    </ul>

                    <h6>리뷰</h6>
                    <ul th:if="${movie.reviews != null}">
                        <li th:each="review : ${movie.reviews}">
                            <strong th:text="${review.author}"></strong>: <span th:text="${#strings.abbreviate(review.content, 100)}"></span>
                        </li>
                    </ul>

                    <h6>유사한 영화</h6>
                    <ul th:if="${movie.similarMovies != null}">
                        <li th:each="similarMovie : ${movie.similarMovies}" th:text="${similarMovie.title}"></li>
                    </ul>

                    <h6>추천 영화</h6>
                    <ul th:if="${movie.recommendedMovies != null}">
                        <li th:each="recommendedMovie : ${movie.recommendedMovies}" th:text="${recommendedMovie.title}"></li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
